name: raildock

# Single-image RailDock setup.
# One command to get up and running:
#   docker compose up -d
#
# Required env vars:
#   DATABASE_URL     — PostgreSQL connection string
#   RAILS_MASTER_KEY — Rails credentials key (generate with: rails credentials:edit)
#   JWT_SECRET_KEY   — Long random string for JWT signing
# Optional:
#   POSTGRES_PASSWORD — defaults to "raildock"
#   RAILS_ENV         — defaults to "production"
#   PORT              — defaults to 80 (external port)

services:
  raildock:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mona-chen/raildock/raildock:latest
    ports:
      - "${PORT:-80}:80"
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "1"
      # Optional: for encrypted storage of SSH keys / tokens
      LOCKBOX_MASTER_KEY: ${LOCKBOX_MASTER_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raildock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raildock}
      POSTGRES_DB: raildock_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raildock -d raildock_production"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: