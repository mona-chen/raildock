name: raildock

# Single-image RailDock setup.
# One command to get up and running:
#   docker compose up -d
#
# Required env vars:
#   DATABASE_URL     — PostgreSQL connection string
#   RAILS_MASTER_KEY — Rails credentials key (generate with: rails credentials:edit)
#   JWT_SECRET_KEY   — Long random string for JWT signing
# Optional:
#   POSTGRES_PASSWORD — defaults to "raildock"
#   RAILS_ENV         — defaults to "production"
#   PORT              — defaults to 8888 (external port)

services:
  raildock:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mona-chen/raildock/raildock:${RAILDOCK_VERSION:-latest}
    ports:
      - "${PORT:-8888}:80"
    labels:
      traefik.enable: "${TRAEFIK_ENABLE:-false}"
      traefik.docker.network: "raildock_default"
      traefik.http.routers.raildock-public-http.entrypoints: "http"
      traefik.http.routers.raildock-public-http.rule: "PathPrefix(`/api/admin/github-app-manifest`) || PathPrefix(`/api/github-apps`)"
      traefik.http.routers.raildock-public-http.priority: "1000"
      traefik.http.services.raildock-public-http.loadbalancer.server.port: "80"
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL}
      CABLE_DATABASE_URL: ${CABLE_DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RAILDOCK_PUBLIC_URL: ${RAILDOCK_PUBLIC_URL:-}
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "1"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      # Optional: for encrypted storage of SSH keys / tokens
      LOCKBOX_MASTER_KEY: ${LOCKBOX_MASTER_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raildock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raildock}
      POSTGRES_DB: raildock_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raildock -d raildock_production"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      BACKUPS_DIR: /backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/raildock-backup:ro
      - ./scripts/restore.sh:/usr/local/bin/raildock-restore:ro
      - ${BACKUPS_DIR:-./backups}:/backups
    command: ["sh", "-c", "echo 'Run: docker compose run --rm backup raildock-backup' && sleep 1"]
    profiles:
      - backup
    restart: "no"

volumes:
  postgres_data:
