name: Build & Push Docker Image

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mona-chen/raildock/raildock
  RUBY_VERSION: "3.4"
  NODE_VERSION: "22"

jobs:
  metadata:
    name: Extract metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.short_sha }}
          cache-from: type=gha,scope=raildock
          cache-to: type=gha,mode=max,scope=raildock
          provenance: true
          sbom: true

  make-public:
    name: Make image public
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set package to public
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/mona-chen/raildock/raildock \
            -f visibility=public 2>/dev/null || true