name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mona-chen/raildock
  RUBY_VERSION: "3.4"
  NODE_VERSION: "22"

jobs:
  # ── Metadata ────────────────────────────────────────────────
  metadata:
    name: Extract metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

  # ── Frontend ───────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/raildock-frontend:latest
            ${{ env.IMAGE_PREFIX }}/raildock-frontend:v${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/raildock-frontend:${{ needs.metadata.outputs.short_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true

  # ── Backend ────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/raildock-backend:latest
            ${{ env.IMAGE_PREFIX }}/raildock-backend:v${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/raildock-backend:${{ needs.metadata.outputs.short_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

  # ── Make Images Public ──────────────────────────────────────
  make-public:
    name: Make images public
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Set packages to public
        run: |
          for PKG in "mona-chen/raildock/raildock-frontend" "mona-chen/raildock/raildock-backend"; do
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              /user/packages/container/${PKG} \
              -f visibility=public 2>/dev/null || true
          done