name: Create Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/mona-chen/raildock/raildock

jobs:
  metadata:
    name: Extract metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog_body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-version:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ -z "$PREV" ]; then
            BODY=$(git log --oneline --format="* %s" HEAD)
          else
            BODY=$(git log --oneline --format="* %s" ${PREV}..${TAG})
          fi
          echo "body=${BODY:-No changes}" >> $GITHUB_OUTPUT

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: RailDock v${{ needs.metadata.outputs.version }}
          body: |
            ## RailDock v${{ needs.metadata.outputs.version }}

            **Docker image:** `ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}`

            ### Quick start (one line)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/mona-chen/raildock/main/install.sh | bash
            ```

            ### Manual setup

            ```bash
            # Pull the image
            docker pull ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}

            # Run with required env vars
            docker run -d -p 80:80 \\
              -e DATABASE_URL="postgres://user:pass@host:5432/raildock" \\
              -e RAILS_MASTER_KEY="..." \\
              -e JWT_SECRET_KEY="..." \\
              ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}
            ```

            Or use docker-compose:

            ```yaml
            services:
              raildock:
                image: ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}
                environment:
                  DATABASE_URL: "postgres://user:pass@host:5432/raildock"
                  RAILS_MASTER_KEY: "..."
                  JWT_SECRET_KEY: "..."
            ```

            ### What's new

            ${{ needs.metadata.outputs.changelog_body }}
          draft: false
          prerelease: ${{ contains(needs.metadata.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}