name: Create Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mona-chen/raildock/raildock
  # Opt into Node 24 ahead of the GitHub Actions Node 20 deprecation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Extract metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and push release image
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            RAILDOCK_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=raildock-release
          provenance: true
          sbom: true

      - name: Make image public
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/mona-chen/raildock/raildock \
            -f visibility=public 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: RailDock v${{ needs.metadata.outputs.version }}
          body: |
            ## RailDock v${{ needs.metadata.outputs.version }}

            **Docker image:** `ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}`

            ### Quick start (one line)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/mona-chen/raildock/main/install.sh | bash
            ```

            ### Manual setup

            ```bash
            # Pull the image
            docker pull ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}

            # Run with required env vars
            docker run -d -p 80:80 \\
              -e DATABASE_URL="postgres://user:pass@host:5432/raildock" \\
              -e RAILS_MASTER_KEY="..." \\
              -e JWT_SECRET_KEY="..." \\
              ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}
            ```

            Or use docker-compose:

            ```yaml
            services:
              raildock:
                image: ghcr.io/mona-chen/raildock/raildock:v${{ needs.metadata.outputs.version }}
                environment:
                  DATABASE_URL: "postgres://user:pass@host:5432/raildock"
                  RAILS_MASTER_KEY: "..."
                  JWT_SECRET_KEY: "..."
            ```

            ### What's new

          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.metadata.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
