# Dynamic configuration for Traefik
# This directory is watched by Traefik and changes are applied automatically.
# Add file-based routes, middlewares, and TLS options here.

http:
  middlewares:
    # Compress responses for better performance
    compress:
      compress: {}

    # Basic security headers
    security-headers:
      headers:
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true

  # routers:
