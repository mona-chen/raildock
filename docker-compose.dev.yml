# Development override for live code reloading
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  traefik:
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
      - "--log.level=INFO"
      - "--entrypoints.http.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=raildock"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "8090:80"

  frontend:
    image: node:20-alpine
    working_dir: /app
    build: !reset null
    volumes:
      - ./app:/app
      - frontend-node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.raildock-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.raildock-web.priority=1"
      - "traefik.http.routers.raildock-web.entrypoints=http"
      - "traefik.http.services.raildock-web.loadbalancer.server.port=5173"
    restart: unless-stopped

  backend:
    build: !reset null
    image: raildock-backend:latest
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD}@db:5432/raildock_production
      QUEUE_DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD}@db:5432/raildock_production_queue
      CABLE_DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD}@db:5432/raildock_production_cable
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: raildock
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: https://${RAILDOCK_DOMAIN:-localhost}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_SERVE_STATIC_FILES: "true"
    command: ["./bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.raildock-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.raildock-api.priority=10"
      - "traefik.http.routers.raildock-api.entrypoints=http"
      - "traefik.http.routers.raildock-api.service=raildock-api"
      - "traefik.http.routers.raildock-cable.rule=PathPrefix(`/cable`)"
      - "traefik.http.routers.raildock-cable.priority=10"
      - "traefik.http.routers.raildock-cable.entrypoints=http"
      - "traefik.http.routers.raildock-cable.service=raildock-api"
      - "traefik.http.services.raildock-api.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dokku:
    ports:
      - "3022:22"

  worker:
    build: !reset null
    image: raildock-backend:latest
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD}@db:5432/raildock_production
      QUEUE_DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD}@db:5432/raildock_production_queue
      CABLE_DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD}@db:5432/raildock_production_cable
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: raildock
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    command: ["./bin/rails", "solid_queue:start"]

volumes:
  frontend-node_modules:
  backend_bundle:
