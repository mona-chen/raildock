# Development override for live code reloading with hot reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Overrides the production build with live volume mounts so changes to
# app/ and backend/ are reflected immediately without rebuilding.

services:
  raildock:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mona-chen/raildock/raildock:dev
    volumes:
      # Mount source directories over the built files inside the container
      - ./app:/app:ro
      - ./backend:/rails:ro
      - frontend_node_modules:/usr/share/nginx/html/node_modules
      - raildock_bundle:/usr/local/bundle
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD:-raildock}@db:5432/raildock_production
      QUEUE_DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD:-raildock}@db:5432/raildock_production_queue
      CABLE_DATABASE_URL: postgres://raildock:${POSTGRES_PASSWORD:-raildock}@db:5432/raildock_production_cable
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: raildock
      DB_PASSWORD: ${POSTGRES_PASSWORD:-raildock}
      FRONTEND_URL: http://localhost
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "1"
    # Override the CMD to start only puma (nginx serves built files from /app volume)
    command: >
      sh -c "
        echo '==> Starting Rails server (development mode)...' &&
        cd /rails &&
        bundle exec rails server -p 3000 -b 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  raildock_bundle:
