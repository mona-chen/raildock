production:
  run_due_backups:
    class: RunDueBackupsJob
    schedule: every minute

  archive_postgres_wal:
    class: RunPostgresPitrJob
    schedule: every minute

  run_recovery_drills:
    class: RunRecoveryDrillsJob
    schedule: every Sunday at 3am

  reconcile_stale_deployments:
    class: ReconcileStaleDeploymentsJob
    schedule: every 10 minutes

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  check_app_update:
    class: CheckAppUpdateJob
    schedule: every 6 hours

  malware_scan:
    class: MalwareScanJob
    schedule: every hour at minute 5
