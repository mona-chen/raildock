default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Control plane: deployments plus lightweight housekeeping. This worker is
    # intentionally separate from the backup workers so a backup upload that is
    # stuck on an unreachable destination can never occupy the threads a
    # deployment needs.
    - queues: [ deployments, default ]
      threads: <%= ENV.fetch("CONTROL_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Data-safety work (scheduled/volume backups, PITR archives and base
    # backups, restore drills, destination verification). Bandwidth-bound and
    # allowed to fail slowly; give it its own processes so a backlog here does
    # not delay anything else.
    - queues: [ backups ]
      threads: <%= ENV.fetch("BACKUP_THREADS", 2) %>
      processes: <%= ENV.fetch("BACKUP_CONCURRENCY", 1) %>
      polling_interval: 0.5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
