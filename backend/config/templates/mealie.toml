name = "Mealie"
description = "A recipe manager and meal planner."
category = "stack"
logo = "svgs/mealie.png"

[[services]]
name = "mealie"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/mealie-recipes/mealie:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    ALLOW_SIGNUP = "true"
    PUID = "1000"
    PGID = "1000"
    TZ = "Europe/Berlin"
    MAX_WORKERS = "1"
    WEB_CONCURRENCY = "1"
    [[services.storage]]
      host = "mealie_data"
      container = "/app/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10
