name = "Moodle"
description = "Moodle is the world’s most customisable and trusted eLearning solution that empowers educators to improve our world."
category = "stack"
logo = "svgs/moodle.png"

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
  [services.env]
    ALLOW_EMPTY_PASSWORD = "no"
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "bitnami_moodle"
    MYSQL_USER = "${{ secret() }}"
    MYSQL_PASSWORD = "${{ secret() }}"
    MARIADB_CHARACTER_SET = "utf8mb4"
    MARIADB_COLLATE = "utf8mb4_unicode_ci"
    [[services.storage]]
      host = "mariadb-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "moodle"
category = "app"
subtype = "docker"
docker_image = "docker.io/bitnamilegacy/moodle:4.3"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    MOODLE_DATABASE_HOST = "mariadb"
    MOODLE_DATABASE_PORT_NUMBER = "3306"
    MOODLE_DATABASE_USER = "${{ linked.mariadb.MYSQL_USER }}"
    MOODLE_DATABASE_NAME = "bitnami_moodle"
    MOODLE_DATABASE_PASSWORD = "${{ linked.mariadb.MYSQL_PASSWORD }}"
    ALLOW_EMPTY_PASSWORD = "no"
    MOODLE_USERNAME = "user"
    MOODLE_PASSWORD = "${{ secret() }}"
    MOODLE_EMAIL = "user@example.com"
    MOODLE_SITE_NAME = "New Site"
    [[services.storage]]
      host = "moodle-data"
      container = "/bitnami/moodle"
    [[services.storage]]
      host = "moodledata-data"
      container = "/bitnami/moodledata"
  [services.checks]
    enabled = true
    wait = 20
    timeout = 10

[[links]]
from = "moodle"
to = "mariadb"