name = "Spacebot"
description = "An agentic AI system with specialized processes for thinking, working, and remembering."
category = "stack"
logo = "svgs/spacebot.png"

[[services]]
name = "spacebot"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/spacedriveapp/spacebot:full"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    ANTHROPIC_API_KEY = "${{ secret() }}"
    OPENAI_API_KEY = "${{ secret() }}"
    OPENROUTER_API_KEY = "${{ secret() }}"
    DISCORD_BOT_TOKEN = "${{ secret() }}"
    SLACK_BOT_TOKEN = "${{ secret() }}"
    SLACK_APP_TOKEN = "${{ secret() }}"
    BRAVE_SEARCH_API_KEY = "${{ secret() }}"
    SPACEBOT_CHANNEL_MODEL = "SPACEBOT_CHANNEL_MODEL_VALUE"
    SPACEBOT_WORKER_MODEL = "SPACEBOT_WORKER_MODEL_VALUE"
    [[services.storage]]
      host = "spacebot-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 5
