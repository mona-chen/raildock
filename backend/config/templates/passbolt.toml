name = "Passbolt Community Edition (CE) API. The JSON API for the open source password manager for teams!"
description = "Passbolt Community Edition (CE) API. The JSON API for the open source password manager for teams!"
category = "stack"
logo = "svgs/passbolt.svg"
[[services]]
name = "passbolt"
category = "app"
subtype = "docker"
docker_image = "passbolt/passbolt:latest-ce"
start_command = "/usr/bin/wait-for.sh -t 0 mariadb:3306 -- /docker-entrypoint.sh"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_PASSBOLT = ""
    APP_FULL_BASE_URL = "${SERVICE_URL_PASSBOLT}"
    DATASOURCES_DEFAULT_HOST = "mariadb"
    DATASOURCES_DEFAULT_USERNAME = "${SERVICE_USER_PASSBOLT}"
    DATASOURCES_DEFAULT_PASSWORD = "${SERVICE_PASSWORD_PASSBOLT}"
    DATASOURCES_DEFAULT_DATABASE = "${MYSQL_DB:-passbolt-db}"
    [[services.storage]]
      host = "gpg_volume"
      container = "/etc/passbolt/gpg"
    [[services.storage]]
      host = "jwt_volume"
      container = "/etc/passbolt/jwt"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
docker_image = "mariadb:11"
source = { type = "docker"  }
  [services.env]
    MARIADB_ROOT_PASSWORD = "${SERVICE_PASSWORD_ROOTMARIADB}"
    MARIADB_DATABASE = "${MYSQL_DB:-passbolt-db}"
    MARIADB_USER = "${SERVICE_USER_PASSBOLT}"
    MARIADB_PASSWORD = "${SERVICE_PASSWORD_PASSBOLT}"
    [[services.storage]]
      host = "passbolt_mariadb_data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "passbolt"
to = "mariadb"
