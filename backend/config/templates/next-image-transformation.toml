name = "Next Image Transformation"
description = "Drop-in replacement for Vercel's Nextjs image optimization service."
category = "stack"
logo = "coolify-logo.svg"

[[services]]
name = "next-image-transformation"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/coollabsio/next-image-transformation:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    NODE_ENV = "production"
    ALLOWED_REMOTE_DOMAINS = "*"
    IMGPROXY_URL = "http://imgproxy:8080"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "imgproxy"
category = "app"
subtype = "docker"
docker_image = "darthsim/imgproxy"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    IMGPROXY_ENABLE_WEBP_DETECTION = "true"
    IMGPROXY_JPEG_PROGRESSIVE = "true"
    IMGPROXY_USE_ETAG = "true"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
