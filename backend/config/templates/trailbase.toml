name = "Trailbase"
description = "A blazingly fast Rust/SQLite/Wasmtime app server with type-safe APIs"
category = "stack"
logo = "svgs/trailbase.svg"

[[services]]
name = "trailbase"
category = "app"
subtype = "docker"
docker_image = "trailbase/trailbase:0.22.6"
source = { type = "docker"  }
  [services.scaling]
    web = 1
    [[services.storage]]
      host = "trailbase-data"
      container = "/app/traildepot"
