name = "Next.js"
description = "Next.js fullstack app with PostgreSQL"
category = "stack"

[[services]]
name = "web"
category = "app"
subtype = "node"
builder = "nixpacks"
source = { type = "git" }

  [services.scaling]
  web = 1

  [services.env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

  [services.proxy]
  enabled = true
  type = "traefik"

    [[services.proxy.ports]]
    host = 80
    container = 3000

[[services]]
name = "database"
category = "database"
subtype = "postgres"
version = "16"

[[links]]
from = "web"
to = "database"
