name = "Connect your devices into a secure WireGuard®-based overlay network with SSO, MFA and granular access controls."
description = "Connect your devices into a secure WireGuard®-based overlay network with SSO, MFA and granular access controls."
category = "stack"
logo = "svgs/netbird.png"
[[services]]
name = "netbird-client"
category = "app"
subtype = "docker"
docker_image = "netbirdio/netbird:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    NB_SETUP_KEY = "${NB_SETUP_KEY}"
    NB_ENABLE_ROSENPASS = "${NB_ENABLE_ROSENPASS:-false}"
    NB_ENABLE_EXPERIMENTAL_LAZY_CONN = "${NB_ENABLE_EXPERIMENTAL_LAZY_CONN:-false}"
    [[services.storage]]
      host = "netbird-client"
      container = "/var/lib/netbird"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20
