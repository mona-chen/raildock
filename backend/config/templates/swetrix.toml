name = "Swetrix"
description = "Privacy-friendly and cookieless European web analytics alternative to Google Analytics."
category = "stack"
logo = "svgs/swetrix.svg"

[[services]]
name = "swetrix"
category = "app"
subtype = "docker"
docker_image = "swetrix/swetrix-fe:v4.0.5"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    API_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 5

[[services]]
name = "swetrix-api"
category = "app"
subtype = "docker"
docker_image = "swetrix/swetrix-api:v4.0.5"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SECRET_KEY_BASE = "${{ secret() }}"
    DISABLE_REGISTRATION = "false"
    DEBUG_MODE = "false"
    CLOUDFLARE_PROXY_ENABLED = "false"
    SMTP_MOCK = "false"
    OIDC_ENABLED = "false"
    OIDC_ONLY_AUTH = "false"
    REDIS_HOST = "redis"
    CLICKHOUSE_HOST = "http://clickhouse"
    CLICKHOUSE_PASSWORD = "${{ secret() }}"
    REDIS_PASSWORD = "${{ secret() }}"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 5

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:8.2-alpine"
source = { type = "docker"  }
  [services.env]
    REDIS_PORT = "6379"
    REDIS_USER = "default"
    REDIS_PASSWORD = "${{ linked.redis.REDIS_PASSWORD }}"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 5

[[services]]
name = "clickhouse"
category = "app"
subtype = "docker"
docker_image = "clickhouse/clickhouse-server:24.10-alpine"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    CLICKHOUSE_DATABASE = "analytics"
    CLICKHOUSE_USER = "default"
    CLICKHOUSE_PORT = "8123"
    CLICKHOUSE_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "swetrix-events-data"
      container = "/var/lib/clickhouse"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 5

