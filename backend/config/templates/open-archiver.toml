name = "A self-hosted, open-source email archiving solution with full-text search capability."
description = "A self-hosted, open-source email archiving solution with full-text search capability."
category = "stack"
logo = "svgs/openarchiver.svg"
[[services]]
name = "open-archiver"
category = "app"
subtype = "docker"
docker_image = "logiclabshq/open-archiver:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_OPENARCHIVER_3000 = ""
    ENCRYPTION_KEY = "${SERVICE_HEX_64_ENCRYPTIONKEY}"
    STORAGE_ENCRYPTION_KEY = "${SERVICE_HEX_64_STORAGEENCRYPTIONKEY}"
    PORT_BACKEND = "${PORT_BACKEND:-4000}"
    PORT_FRONTEND = "${PORT_FRONTEND:-3000}"
    NODE_ENV = "${NODE_ENV:-production}"
    SYNC_FREQUENCY = "${SYNC_FREQUENCY:-* * * * *}"
    POSTGRES_DB = "${POSTGRES_DB:-open_archive}"
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    DATABASE_URL = "postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-open-archiver-db}"
    MEILI_MASTER_KEY = "${SERVICE_PASSWORD_MEILISEARCH}"
    MEILI_HOST = "http://meilisearch:7700"
    REDIS_HOST = "valkey"
    REDIS_PORT = "6379"
    REDIS_PASSWORD = "${SERVICE_PASSWORD_VALKEY}"
    REDIS_TLS_ENABLED = "false"
    STORAGE_TYPE = "${STORAGE_TYPE:-local}"
    STORAGE_LOCAL_ROOT_PATH = "${STORAGE_LOCAL_ROOT_PATH:-/var/data/open-archiver}"
    BODY_SIZE_LIMIT = "${BODY_SIZE_LIMIT:-100M}"
    STORAGE_S3_ENDPOINT = "${STORAGE_S3_ENDPOINT}"
    STORAGE_S3_BUCKET = "${STORAGE_S3_BUCKET}"
    STORAGE_S3_ACCESS_KEY_ID = "${STORAGE_S3_ACCESS_KEY_ID}"
    STORAGE_S3_SECRET_ACCESS_KEY = "${STORAGE_S3_SECRET_ACCESS_KEY}"
    STORAGE_S3_REGION = "${STORAGE_S3_REGION}"
    STORAGE_S3_FORCE_PATH_STYLE = "${STORAGE_S3_FORCE_PATH_STYLE:-false}"
    JWT_SECRET = "${SERVICE_BASE64_128_JWT}"
    JWT_EXPIRES_IN = "${JWT_EXPIRES_IN:-7d}"
    RATE_LIMIT_WINDOW_MS = "${RATE_LIMIT_WINDOW_MS:-60000}"
    RATE_LIMIT_MAX_REQUESTS = "${RATE_LIMIT_MAX_REQUESTS:-100}"
    [[services.storage]]
      host = "archiver-data"
      container = "/var/data/open-archiver"

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:17-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_DB = "${POSTGRES_DB:-open-archiver-db}"
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    LC_ALL = "C"
    [[services.storage]]
      host = "postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 20

[[services]]
name = "valkey"
category = "app"
subtype = "docker"
docker_image = "valkey/valkey:8-alpine"
start_command = "valkey-server --requirepass ${SERVICE_PASSWORD_VALKEY}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
    [[services.storage]]
      host = "valkey-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "meilisearch"
category = "search"
subtype = "meilisearch"
docker_image = "getmeili/meilisearch:v1.15"
source = { type = "docker"  }
  [services.env]
    MEILI_MASTER_KEY = "${SERVICE_PASSWORD_MEILISEARCH}"
    [[services.storage]]
      host = "meilisearch-data"
      container = "/meili_data"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[links]]
from = "open-archiver"
to = "postgres"

[[links]]
from = "open-archiver"
to = "valkey"

[[links]]
from = "open-archiver"
to = "meilisearch"
