name = "Open Archiver"
description = "A self-hosted, open-source email archiving solution with full-text search capability."
category = "stack"
logo = "svgs/openarchiver.svg"

[[services]]
name = "open-archiver"
category = "app"
subtype = "docker"
docker_image = "logiclabshq/open-archiver:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    ENCRYPTION_KEY = "CHANGE_ME"
    STORAGE_ENCRYPTION_KEY = "CHANGE_ME"
    PORT_BACKEND = "4000"
    PORT_FRONTEND = "3000"
    NODE_ENV = "production"
    SYNC_FREQUENCY = "* * * * *"
    POSTGRES_DB = "open_archive"
    POSTGRES_USER = "user"
    POSTGRES_PASSWORD = "CHANGE_ME"
    DATABASE_URL = "postgresql://user:CHANGE_ME@postgres:5432/open-archiver-db"
    MEILI_MASTER_KEY = "CHANGE_ME"
    MEILI_HOST = "http://meilisearch:7700"
    REDIS_HOST = "valkey"
    REDIS_PORT = "6379"
    REDIS_PASSWORD = "CHANGE_ME"
    REDIS_TLS_ENABLED = "false"
    STORAGE_TYPE = "local"
    STORAGE_LOCAL_ROOT_PATH = "/var/data/open-archiver"
    BODY_SIZE_LIMIT = "100M"
    STORAGE_S3_ENDPOINT = "STORAGE_S3_ENDPOINT_VALUE"
    STORAGE_S3_BUCKET = "STORAGE_S3_BUCKET_VALUE"
    STORAGE_S3_ACCESS_KEY_ID = "CHANGE_ME"
    STORAGE_S3_SECRET_ACCESS_KEY = "CHANGE_ME"
    STORAGE_S3_REGION = "STORAGE_S3_REGION_VALUE"
    STORAGE_S3_FORCE_PATH_STYLE = "false"
    JWT_SECRET = "BASE64_GENERATED"
    JWT_EXPIRES_IN = "7d"
    RATE_LIMIT_WINDOW_MS = "60000"
    RATE_LIMIT_MAX_REQUESTS = "100"
    [[services.storage]]
      host = "archiver-data"
      container = "/var/data/open-archiver"

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:17-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_DB = "open-archiver-db"
    POSTGRES_USER = "user"
    POSTGRES_PASSWORD = "CHANGE_ME"
    LC_ALL = "C"
    [[services.storage]]
      host = "postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 20

[[services]]
name = "valkey"
category = "app"
subtype = "docker"
docker_image = "valkey/valkey:8-alpine"
start_command = "valkey-server --requirepass ${SERVICE_PASSWORD_VALKEY}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
    [[services.storage]]
      host = "valkey-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "meilisearch"
category = "search"
subtype = "meilisearch"
docker_image = "getmeili/meilisearch:v1.15"
source = { type = "docker"  }
  [services.env]
    MEILI_MASTER_KEY = "CHANGE_ME"
    [[services.storage]]
      host = "meilisearch-data"
      container = "/meili_data"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[links]]
from = "open-archiver"
to = "postgres"

[[links]]
from = "open-archiver"
to = "valkey"

[[links]]
from = "open-archiver"
to = "meilisearch"

[[links]]
from = "valkey"
to = "postgres"

[[links]]
from = "valkey"
to = "meilisearch"
