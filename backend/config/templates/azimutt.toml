name = "Next-Gen ERD: Design, Explore, Document and Analyze your database."
description = "Next-Gen ERD: Design, Explore, Document and Analyze your database."
category = "stack"
logo = "svgs/azimutt.png"
[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:15"
source = { type = "docker"  }
  [services.env]
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    POSTGRES_DB = "${POSTGRES_DB:-azimutt}"
    [[services.storage]]
      host = "azimutt-postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "minio"
category = "service"
subtype = "s3"
docker_image = "ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z"
start_command = "server /data --console-address \":9001\""
source = { type = "docker"  }
  [services.env]
    MINIO_SERVER_URL = "$MINIO_SERVER_URL"
    MINIO_BROWSER_REDIRECT_URL = "$MINIO_BROWSER_REDIRECT_URL"
    MINIO_ROOT_USER = "$SERVICE_USER_MINIO"
    MINIO_ROOT_PASSWORD = "$SERVICE_PASSWORD_MINIO"
    [[services.storage]]
      host = "azimutt-minio-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "createbuckets"
category = "service"
subtype = "s3"
docker_image = "minio/mc:latest"
source = { type = "docker"  }

[[services]]
name = "smtp"
category = "app"
subtype = "docker"
docker_image = "bytemark/smtp:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_SMTP = ""
    RELAY_HOST = "$SERVICE_URL_SMTP"
    RELAY_PORT = "${RELAY_PORT:-587}"
    RELAY_USERNAME = "$SERVICE_EMAIL_SMTP"
    RELAY_PASSWORD = "$SERVICE_PASSWORD_SMTP"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[services]]
name = "backend"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/azimuttapp/azimutt:main"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_AZIMUTT_4000 = ""
    SENTRY = "false"
    PHX_SERVER = "true"
    PHX_HOST = "$SERVICE_URL_AZIMUTT"
    PORT = "${PORT:-4000}"
    DATABASE_URL = "ecto://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres/${POSTGRES_DB:-azimutt}"
    SECRET_KEY_BASE = "${SERVICE_BASE64_64_AZIMUTT}"
    FILE_STORAGE_ADAPTER = "${FILE_STORAGE_ADAPTER:-s3}"
    AUTH_PASSWORD = "${AUTH_PASSWORD:-true}"
    SKIP_ONBOARDING_FUNNEL = "${SKIP_ONBOARDING_FUNNEL:-true}"
    SKIP_EMAIL_CONFIRMATION = "${SKIP_EMAIL_CONFIRMATION:-true}"
    PUBLIC_SITE = "${PUBLIC_SITE:-false}"
    S3_BUCKET = "${S3_BUCKET}"
    S3_HOST = "${S3_HOST}"
    S3_KEY_ID = "${S3_KEY_ID}"
    S3_KEY_SECRET = "${S3_KEY_SECRET}"
    EMAIL_ADAPTER = "${EMAIL_ADAPTER:-smtp}"
    SMTP_RELAY = "$SERVICE_URL_SMTP"
    SMTP_USERNAME = "$SERVICE_EMAIL_SMTP"
    SMTP_PASSWORD = "$SERVICE_PASSWORD_SMTP"
    SMTP_PORT = "${SMTP_PORT:-587}"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[links]]
from = "createbuckets"
to = "minio"

[[links]]
from = "backend"
to = "postgres"

[[links]]
from = "backend"
to = "minio"
