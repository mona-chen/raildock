name = "Azimutt"
description = "Next-Gen ERD: Design, Explore, Document and Analyze your database."
category = "stack"
logo = "svgs/azimutt.png"

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_USER = "${{ secret() }}"
    POSTGRES_DB = "azimutt"
    [[services.storage]]
      host = "azimutt-postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "minio"
category = "service"
subtype = "s3"
docker_image = "ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z"
start_command = "server /data --console-address \":9001\""
source = { type = "docker"  }
  [services.env]
    MINIO_SERVER_URL = "$MINIO_SERVER_URL"
    MINIO_BROWSER_REDIRECT_URL = "$MINIO_BROWSER_REDIRECT_URL"
    MINIO_ROOT_USER = "${{ secret() }}"
    MINIO_ROOT_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "azimutt-minio-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "createbuckets"
category = "service"
subtype = "s3"
docker_image = "minio/mc:latest"
source = { type = "docker"  }

[[services]]
name = "smtp"
category = "app"
subtype = "docker"
docker_image = "bytemark/smtp:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    RELAY_HOST = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    RELAY_PORT = "587"
    RELAY_USERNAME = "${{ secret() }}"
    RELAY_PASSWORD = "${{ secret() }}"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[services]]
name = "backend"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/azimuttapp/azimutt:main"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SENTRY = "false"
    PHX_SERVER = "true"
    PHX_HOST = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    PORT = "4000"
    SECRET_KEY_BASE = "BASE64_GENERATED"
    FILE_STORAGE_ADAPTER = "s3"
    AUTH_PASSWORD = "true"
    SKIP_ONBOARDING_FUNNEL = "true"
    SKIP_EMAIL_CONFIRMATION = "true"
    PUBLIC_SITE = "false"
    S3_BUCKET = "S3_BUCKET_VALUE"
    S3_HOST = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    S3_KEY_ID = "${{ secret() }}"
    S3_KEY_SECRET = "${{ secret() }}"
    EMAIL_ADAPTER = "smtp"
    SMTP_RELAY = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    SMTP_USERNAME = "${{ secret() }}"
    SMTP_PASSWORD = "${{ secret() }}"
    SMTP_PORT = "587"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[links]]
from = "createbuckets"
to = "minio"

[[links]]
from = "backend"
to = "postgres"

[[links]]
from = "backend"
to = "minio"

[[links]]
from = "smtp"
to = "postgres"