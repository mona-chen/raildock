name = "Silverbullet"
description = "SilverBullet is a tool to develop, organize, and structure your personal knowledge and to make it universally accessible across all your devices."
category = "stack"
logo = "svgs/silverbullet.png"

[[services]]
name = "silverbullet"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/silverbulletmd/silverbullet:v2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SB_USER = "user:${{ secret() }}"
    [[services.storage]]
      host = "silverbullet-space"
      container = "/space"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
