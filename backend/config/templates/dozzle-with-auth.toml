name = "Dozzle With Auth"
description = "Dozzle is a simple and lightweight web UI for Docker logs."
category = "stack"
logo = "svgs/dozzle.svg"

[[services]]
name = "dozzle"
category = "app"
subtype = "docker"
docker_image = "amir20/dozzle:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DOZZLE_AUTH_PROVIDER = "simple"
  [services.checks]
    enabled = true
    wait = 3
    timeout = 30
