BATCH_EXPORT_BUCKET=${LANGFUSE_S3_BATCH_EXPORT_BUCKET:-langfuse}\", \"LANGFUSE_S3_BATCH_EXPORT_PREFIX=${LANGFUSE_S3_BATCH_EXPORT_PREFIX:-exports/}\", \"LANGFUSE_S3_BATCH_EXPORT_REGION=${LANGFUSE_S3_BATCH_EXPORT_REGION:-auto}\", \"LANGFUSE_S3_BATCH_EXPORT_ENDPOINT=${LANGFUSE_S3_BATCH_EXPORT_ENDPOINT}\", \"LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT=${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT}\", \"LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID=${LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID}\", \"LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY=${LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY}\", \"LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE=${LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE:-true}\", \"LANGFUSE_INGESTION_QUEUE_DELAY_MS=${LANGFUSE_INGESTION_QUEUE_DELAY_MS:-1}\", \"LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS=${LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS:-1000}\", \"REDIS_HOST=redis\", \"REDIS_PORT=6379\", \"REDIS_AUTH=${SERVICE_PASSWORD_REDIS}\", \"EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-admin@example.com}\", \"SMTP_CONNECTION_URL=${SMTP_CONNECTION_URL:-}\", \"NEXTAUTH_SECRET=${SERVICE_BASE64_NEXTAUTHSECRET}\", \"AUTH_DISABLE_SIGNUP=${AUTH_DISABLE_SIGNUP:-true}\", \"HOSTNAME=${HOSTNAME:-0.0.0.0}\", \"LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-my-org}\", \"LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-My Org}\", \"LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-my-project}\", \"LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-My Project}\", \"LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}\", \"LANGFUSE_INIT_USER_NAME=${SERVICE_USER_LANGFUSE}\", \"LANGFUSE_INIT_USER_PASSWORD=${SERVICE_PASSWORD_LANGFUSE}\"]"
  [services.checks]
