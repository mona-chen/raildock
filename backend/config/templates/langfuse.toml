    timeout = 10

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:17-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_DB = "${POSTGRES_DB:-langfuse-db}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    [[services.storage]]
      host = "langfuse_postgres_data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:8"
start_command = "sh -c redis-server --requirepass \"$SERVICE_PASSWORD_REDIS\""
source = { type = "docker"  }
  [services.env]
    REDIS_PASSWORD = "${SERVICE_PASSWORD_REDIS}"
    [[services.storage]]
      host = "langfuse_redis_data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 3
    timeout = 10

[[services]]
name = "clickhouse"
category = "app"
subtype = "docker"
docker_image = "clickhouse/clickhouse-server:26.2.4.23"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    CLICKHOUSE_DB = "${CLICKHOUSE_DB:-default}"
    CLICKHOUSE_USER = "${SERVICE_USER_CLICKHOUSE}"
    CLICKHOUSE_PASSWORD = "${SERVICE_PASSWORD_CLICKHOUSE}"
    [[services.storage]]
      host = "langfuse_clickhouse_data"
      container = "/var/lib/clickhouse"
    [[services.storage]]
      host = "langfuse_clickhouse_logs"
      container = "/var/log/clickhouse-server"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[links]]
from = "langfuse"
to = "postgres"

[[links]]
from = "langfuse"
to = "redis"

[[links]]
from = "langfuse"
to = "clickhouse"

[[links]]
from = "langfuse-worker"
to = "postgres"

[[links]]
from = "langfuse-worker"
to = "redis"

[[links]]
from = "langfuse-worker"
to = "clickhouse"
