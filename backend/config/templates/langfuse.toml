name = "Langfuse is an open-source LLM engineering platform that helps teams collaboratively debug, analyze, and iterate on their LLM applications."
description = "Langfuse is an open-source LLM engineering platform that helps teams collaboratively debug, analyze, and iterate on their LLM applications."
category = "stack"
logo = "svgs/langfuse.svg"
[[services]]
name = "langfuse"
category = "app"
subtype = "docker"
docker_image = "langfuse/langfuse:3"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    << = "[\"NEXTAUTH_URL=${SERVICE_URL_LANGFUSE}\", \"DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-langfuse-db}\", \"SALT=${SERVICE_PASSWORD_SALT}\", \"ENCRYPTION_KEY=${SERVICE_PASSWORD_64_LANGFUSE}\", \"TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}\", \"LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}\", \"CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000\", \"CLICKHOUSE_URL=http://clickhouse:8123\", \"CLICKHOUSE_USER=${SERVICE_USER_CLICKHOUSE}\", \"CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}\", \"CLICKHOUSE_CLUSTER_ENABLED=false\", \"LANGFUSE_USE_AZURE_BLOB=${LANGFUSE_USE_AZURE_BLOB:-false}\", \"LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}\", \"LANGFUSE_S3_EVENT_UPLOAD_REGION=${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}\", \"LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}\", \"LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}\", \"LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}\", \"LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}\", \"LANGFUSE_S3_EVENT_UPLOAD_PREFIX=${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}\", \"LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}\", \"LANGFUSE_S3_MEDIA_UPLOAD_REGION=${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-auto}\", \"LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID}\", \"LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY}\", \"LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT}\", \"LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:-true}\", \"LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX:-media/}\", \"LANGFUSE_S3_BATCH_EXPORT_ENABLED=${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}\", \"LANGFUSE_S3_BATCH_EXPORT_BUCKET=${LANGFUSE_S3_BATCH_EXPORT_BUCKET:-langfuse}\", \"LANGFUSE_S3_BATCH_EXPORT_PREFIX=${LANGFUSE_S3_BATCH_EXPORT_PREFIX:-exports/}\", \"LANGFUSE_S3_BATCH_EXPORT_REGION=${LANGFUSE_S3_BATCH_EXPORT_REGION:-auto}\", \"LANGFUSE_S3_BATCH_EXPORT_ENDPOINT=${LANGFUSE_S3_BATCH_EXPORT_ENDPOINT}\", \"LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT=${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT}\", \"LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID=${LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID}\", \"LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY=${LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY}\", \"LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE=${LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE:-true}\", \"LANGFUSE_INGESTION_QUEUE_DELAY_MS=${LANGFUSE_INGESTION_QUEUE_DELAY_MS:-1}\", \"LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS=${LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS:-1000}\", \"REDIS_HOST=redis\", \"REDIS_PORT=6379\", \"REDIS_AUTH=${SERVICE_PASSWORD_REDIS}\", \"EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-admin@example.com}\", \"SMTP_CONNECTION_URL=${SMTP_CONNECTION_URL:-}\", \"NEXTAUTH_SECRET=${SERVICE_BASE64_NEXTAUTHSECRET}\", \"AUTH_DISABLE_SIGNUP=${AUTH_DISABLE_SIGNUP:-true}\", \"HOSTNAME=${HOSTNAME:-0.0.0.0}\", \"LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-my-org}\", \"LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-My Org}\", \"LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-my-project}\", \"LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-My Project}\", \"LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}\", \"LANGFUSE_INIT_USER_NAME=${SERVICE_USER_LANGFUSE}\", \"LANGFUSE_INIT_USER_PASSWORD=${SERVICE_PASSWORD_LANGFUSE}\"]"
    SERVICE_URL_LANGFUSE_3000 = "${SERVICE_URL_LANGFUSE_3000}"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

