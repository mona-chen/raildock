name = "Grimmory"
description = "Grimmory is a self-hosted application for managing your entire book collection in one place. Organize, read, annotate, sync across devices, and share without relying on third-party services."
category = "stack"
logo = "svgs/grimmory.svg"

[[services]]
name = "grimmory"
category = "app"
subtype = "docker"
docker_image = "grimmory/grimmory:nightly-20260403-3a371f7"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    USER_ID = "0"
    GROUP_ID = "0"
    TZ = "UTC"
    DATABASE_URL = "jdbc:mariadb://mariadb:3306/grimmory-db"
    DATABASE_USERNAME = "user"
    DATABASE_PASSWORD = "CHANGE_ME"
    BOOKLORE_PORT = "80"
    [[services.storage]]
      host = "grimmory-data"
      container = "/app/data"
    [[services.storage]]
      host = "grimmory-books"
      container = "/books"
    [[services.storage]]
      host = "grimmory-bookdrop"
      container = "/bookdrop"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
docker_image = "mariadb:12"
source = { type = "docker"  }
  [services.env]
    MARIADB_USER = "user"
    MARIADB_PASSWORD = "CHANGE_ME"
    MARIADB_ROOT_PASSWORD = "CHANGE_ME"
    MARIADB_DATABASE = "grimmory-db"
    [[services.storage]]
      host = "mariadb-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[links]]
from = "grimmory"
to = "mariadb"
