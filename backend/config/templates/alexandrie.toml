name = "Alexandrie"
description = "A powerful Markdown workspace designed for speed, clarity, and creativity."
category = "stack"
logo = "svgs/alexandrie.svg"

[[services]]
name = "frontend"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/smaug6739/alexandrie-frontend:v8.7.2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PORT = "8200"
    NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE = "false"
    NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE = "false"
    NUXT_PUBLIC_BASE_API = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    NUXT_PUBLIC_BASE_CDN = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    NUXT_PUBLIC_CDN_ENDPOINT = "/alexandrie/"
    NUXT_PUBLIC_BASE_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"

[[services]]
name = "backend"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/smaug6739/alexandrie-backend:v8.7.2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    BACKEND_PORT = "8201"
    GIN_MODE = "release"
    JWT_SECRET = "${{ secret() }}"
    COOKIE_DOMAIN = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    FRONTEND_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    ALLOW_UNSECURE = "false"
    DATABASE_HOST = "mysql"
    DATABASE_PORT = "3306"
    DATABASE_NAME = "alexandrie-db"
    DATABASE_USER = "user"
    DATABASE_PASSWORD = "${{ linked.mysql.MYSQL_PASSWORD }}"
    MINIO_ENDPOINT = "rustfs:9000"
    MINIO_PUBLIC_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    MINIO_SECURE = "false"
    MINIO_ACCESSKEY = "user"
    MINIO_SECRETKEY = "${{ linked.rustfs.RUSTFS_SECRET_KEY }}"
    MINIO_BUCKET = "alexandrie"

[[services]]
name = "mysql"
category = "database"
subtype = "mysql"
  [services.env]
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_USER = "${{ secret() }}"
    MYSQL_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "alexandrie-db"
    [[services.storage]]
      host = "mysql-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "rustfs"
category = "app"
subtype = "docker"
docker_image = "rustfs/rustfs:1.0.0-alpha.90"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    RUSTFS_ACCESS_KEY = "user"
    RUSTFS_SECRET_KEY = "${{ secret() }}"
    RUSTFS_CONSOLE_ENABLE = "false"
    RUSTFS_LOG_LEVEL = "info"
    [[services.docker_options]]
      phase = "deploy"
      option = "--user=1000:1000"
    [[services.storage]]
      host = "rustfs-data"
      container = "/data"
    [[services.storage]]
      host = "rustfs-logs"
      container = "/logs"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[links]]
from = "frontend"
to = "backend"

[[links]]
from = "backend"
to = "mysql"

[[links]]
from = "backend"
to = "rustfs"

[[links]]
from = "frontend"
to = "mysql"

[[links]]
from = "rustfs"
to = "mysql"
