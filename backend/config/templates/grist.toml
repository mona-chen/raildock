name = "Grist"
description = "Grist is a modern relational spreadsheet. It combines the flexibility of a spreadsheet with the robustness of a database."
category = "stack"
logo = "svgs/grist.svg"

[[services]]
name = "grist"
category = "app"
subtype = "docker"
docker_image = "gristlabs/grist:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    APP_HOME_URL = "https://example.com"
    APP_DOC_URL = "https://example.com"
    GRIST_DOMAIN = "app.example.com"
    TZ = "UTC"
    GRIST_SUPPORT_ANON = "false"
    GRIST_FORCE_LOGIN = "true"
    COOKIE_MAX_AGE = "86400000"
    GRIST_PAGE_TITLE_SUFFIX = " - Suffix"
    GRIST_HIDE_UI_ELEMENTS = "billing,sendToDrive,supportGrist,multiAccounts,tutorials"
    GRIST_UI_FEATURES = "helpCenter,billing,templates,createSite,multiSite,sendToDrive,tutorials,supportGrist"
    GRIST_DEFAULT_EMAIL = "?"
    GRIST_ORG_IN_PATH = "true"
    GRIST_OIDC_SP_HOST = "https://example.com"
    GRIST_OIDC_IDP_SCOPES = "openid profile email"
    GRIST_OIDC_IDP_SKIP_END_SESSION_ENDPOINT = "false"
    GRIST_OIDC_IDP_ISSUER = "${OIDC_IDP_ISSUER:?}"
    GRIST_OIDC_IDP_CLIENT_ID = "${OIDC_IDP_CLIENT_ID:?}"
    GRIST_OIDC_IDP_CLIENT_SECRET = "${OIDC_IDP_CLIENT_SECRET:?}"
    GRIST_SESSION_SECRET = "SERVICE_REALBASE64_128_VALUE"
    GRIST_HOME_INCLUDE_STATIC = "true"
    GRIST_SANDBOX_FLAVOR = "gvisor"
    ALLOWED_WEBHOOK_DOMAINS = "ALLOWED_WEBHOOK_DOMAINS_VALUE"
    COMMENTS = "true"
    TYPEORM_TYPE = "postgres"
    TYPEORM_DATABASE = "grist-db"
    TYPEORM_USERNAME = "user"
    TYPEORM_PASSWORD = "${{ secret() }}"
    TYPEORM_HOST = "postgres"
    TYPEORM_PORT = "5432"
    TYPEORM_LOGGING = "false"
    REDIS_URL = "redis://redis:6379"
    GRIST_HELP_CENTER = "https://example.com/help"
    GRIST_TERMS_OF_SERVICE_URL = "https://example.com/terms"
    FREE_COACHING_CALL_URL = "https://example.com"
    GRIST_CONTACT_SUPPORT_URL = "https://example.com"
    [[services.storage]]
      host = "grist-data"
      container = "/persist"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRES_DB = "grist-db"
    POSTGRES_USER = "user"
    POSTGRES_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "grist_postgres_data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:7"
source = { type = "docker"  }
    [[services.storage]]
      host = "grist_redis_data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[links]]
from = "grist"
to = "postgres"

[[links]]
from = "grist"
to = "redis"