name = "Booklore is an open-source library management system for your digital book collection."
description = "Booklore is an open-source library management system for your digital book collection."
category = "stack"
logo = "svgs/booklore.svg"
[[services]]
name = "booklore"
category = "app"
subtype = "docker"
docker_image = "booklore/booklore:v1.16.5"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_BOOKLORE_80 = ""
    USER_ID = "${BOOKLORE_USER_ID:-0}"
    GROUP_ID = "${BOOKLORE_GROUP_ID:-0}"
    TZ = "${TZ:-UTC}"
    DATABASE_URL = "jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-booklore-db}"
    DATABASE_USERNAME = "${SERVICE_USER_MARIADB}"
    DATABASE_PASSWORD = "${SERVICE_PASSWORD_MARIADB}"
    BOOKLORE_PORT = "80"
    [[services.storage]]
      host = "booklore-data"
      container = "/app/data"
    [[services.storage]]
      host = "booklore-books"
      container = "/books"
    [[services.storage]]
      host = "~/booklore"
      container = "/bookdrop"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
docker_image = "mariadb:12"
source = { type = "docker"  }
  [services.env]
    MARIADB_USER = "${SERVICE_USER_MARIADB}"
    MARIADB_PASSWORD = "${SERVICE_PASSWORD_MARIADB}"
    MARIADB_ROOT_PASSWORD = "${SERVICE_PASSWORD_MARIADBROOT}"
    MARIADB_DATABASE = "${MARIADB_DATABASE:-booklore-db}"
    [[services.storage]]
      host = "mariadb-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[links]]
from = "booklore"
to = "mariadb"
