name = "Super simple group chat, without a subscription."
description = "Super simple group chat, without a subscription."
category = "stack"
logo = "svgs/once-campfire.png"
[[services]]
name = "campfire"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/basecamp/once-campfire:${TAG:-main}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_CAMPFIRE_80 = ""
    SECRET_KEY_BASE = "${SERVICE_BASE64_64_CAMPFIRE}"
    VAPID_PUBLIC_KEY = "${VAPID_PUBLIC_KEY}"
    VAPID_PRIVATE_KEY = "${VAPID_PRIVATE_KEY}"
    DISABLE_SSL = "${DISABLE_SSL:-true}"
    SSL_DOMAIN = "${SSL_DOMAIN:-false}"
    SKIP_TELEMETRY = "${SKIP_TELEMETRY:-true}"
    SENTRY_DSN = "${SENTRY_DSN}"
    [[services.storage]]
      host = "campfire-storage"
      container = "/rails/storage"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5
