name = "A lightweight and easy-to-use wiki platform for creating and managing documentation and knowledge bases."
description = "A lightweight and easy-to-use wiki platform for creating and managing documentation and knowledge bases."
category = "stack"
logo = "svgs/dokuwiki.png"
[[services]]
name = "dokuwiki"
category = "app"
subtype = "docker"
docker_image = "lscr.io/linuxserver/dokuwiki:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_DOKUWIKI = ""
    PUID = "1000"
    PGID = "1000"
    TZ = "Europe/Madrid"
    [[services.storage]]
      host = "dokuwiki-config"
      container = "/config"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
