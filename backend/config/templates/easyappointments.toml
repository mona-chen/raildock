name = "Easyappointments"
description = "Schedule Anything. Let's start with easy! Get the best free online appointment scheduler on your server, today."
category = "stack"
logo = "svgs/easyappointments.png"

[[services]]
name = "easyappointments"
category = "app"
subtype = "docker"
docker_image = "alextselegidis/easyappointments:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    BASE_URL = "https://example.com"
    DB_HOST = "mysql"
    DB_NAME = "easyappointments"
    DB_USERNAME = "root"
    DB_PASSWORD = "${{ secret() }}"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "mysql"
category = "database"
subtype = "mysql"
  [services.env]
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "easyappointments"
    [[services.storage]]
      host = "easyappointments-mysql-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "easyappointments"
to = "mysql"