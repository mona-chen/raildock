name = "Marimo"
description = "An open-source reactive notebook for Python — reproducible, git-friendly, SQL built-in, executable as a script, and shareable as an app."
category = "stack"
logo = "svgs/marimo.svg"

[[services]]
name = "marimo"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/marimo-team/marimo:latest-sql"
start_command = "marimo edit --token-password ${{ secret() }} --port 8080 --host 0.0.0.0"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    TOKEN_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "marimo"
      container = "/app"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5
