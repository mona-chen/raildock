name = "Website change detection monitor and notifications."
description = "Website change detection monitor and notifications."
category = "stack"
logo = "svgs/changedetection.png"
[[services]]
name = "changedetection"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/dgtlmoon/changedetection.io"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_CHANGEDETECTION_5000 = ""
    BASE_URL = "${SERVICE_URL_CHANGEDETECTION}"
    PUID = "${PUID:-1000}"
    PGID = "${PGID:-1000}"
    PLAYWRIGHT_DRIVER_URL = "${PLAYWRIGHT_DRIVER_URL:-ws://browser-sockpuppet-chrome:3000}"
    HIDE_REFERER = "${HIDE_REFERER:-true}"
    FETCH_WORKERS = "${FETCH_WORKERS:-10}"
    MINIMUM_SECONDS_RECHECK_TIME = "${MINIMUM_SECONDS_RECHECK_TIME:-3}"
    DISABLE_VERSION_CHECK = "${DISABLE_VERSION_CHECK:-true}"
    SCREENSHOT_MAX_HEIGHT = "${SCREENSHOT_MAX_HEIGHT:-16000}"
    TZ = "${TZ:-UTC}"
    LOGGER_LEVEL = "${LOGGER_LEVEL:-DEBUG}"
    [[services.storage]]
      host = "changedetection-data"
      container = "/datastore"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "browser-sockpuppet-chrome"
category = "app"
subtype = "docker"
docker_image = "dgtlmoon/sockpuppetbrowser:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SCREEN_WIDTH = "${SCREEN_WIDTH:-1920}"
    SCREEN_HEIGHT = "${SCREEN_HEIGHT:-1024}"
    SCREEN_DEPTH = "${SCREEN_DEPTH:-16}"
    MAX_CONCURRENT_CHROME_PROCESSES = "${MAX_CONCURRENT_CHROME_PROCESSES:-10}"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "changedetection"
to = "browser-sockpuppet-chrome"
