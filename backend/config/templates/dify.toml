name = "Dify"
description = "Dify is an open-source LLM app development platform. Dify's intuitive interface combines AI workflow, RAG pipeline, agent capabilities, model management, observability features and more, letting you quickly go from prototype to production."
category = "stack"
logo = "svgs/dify.png"

[[services]]
name = "api"
category = "app"
subtype = "docker"
docker_image = "langgenius/dify-api:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SECRET_KEY = "${{ secret() }}"
    INIT_PASSWORD = "${{ secret() }}"
    LOG_LEVEL = "INFO"
    DEBUG = "false"
    FLASK_DEBUG = "false"
    CHECK_UPDATE_URL = "https://updates.dify.ai"
    OPENAI_API_BASE = "https://api.openai.com/v1"
    FILES_ACCESS_TIMEOUT = "300"
    APP_MAX_ACTIVE_REQUESTS = "0"
    MIGRATION_ENABLED = "true"
    DEPLOY_ENV = "PRODUCTION"
    DIFY_BIND_ADDRESS = "0.0.0.0"
    DIFY_PORT = "5001"
    GUNICORN_TIMEOUT = "360"
    CELERY_AUTO_SCALE = "false"
    API_TOOL_DEFAULT_CONNECT_TIMEOUT = "10"
    API_TOOL_DEFAULT_READ_TIMEOUT = "60"
    DB_USERNAME = "${{ linked.db.POSTGRES_USER }}"
    DB_DATABASE = "dify"
    SQLALCHEMY_POOL_SIZE = "30"
    SQLALCHEMY_POOL_RECYCLE = "3600"
    SQLALCHEMY_ECHO = "false"
    POSTGRES_MAX_CONNECTIONS = "100"
    POSTGRES_SHARED_BUFFERS = "128MB"
    POSTGRES_WORK_MEM = "4MB"
    POSTGRES_MAINTENANCE_WORK_MEM = "64MB"
    POSTGRES_EFFECTIVE_CACHE_SIZE = "4096MB"
    REDIS_HOST = "redis"
    REDIS_PORT = "6379"
    REDIS_PASSWORD = "${{ linked.redis.REDIS_PASSWORD }}"
    REDIS_USE_SSL = "false"
    REDIS_DB = "0"
    CELERY_BROKER_URL = "redis://:${{ linked.redis.REDIS_PASSWORD }}@redis:6379/1"
    BROKER_USE_SSL = "false"
    WEB_API_CORS_ALLOW_ORIGINS = "*"
    CONSOLE_CORS_ALLOW_ORIGINS = "*"
    STORAGE_TYPE = "local"
    STORAGE_LOCAL_PATH = "storage"
    S3_USE_AWS_MANAGED_IAM = "false"
    S3_REGION = "us-east-1"
    ALIYUN_OSS_AUTH_VERSION = "v4"
    VECTOR_STORE = "weaviate"
    WEAVIATE_ENDPOINT = "http://weaviate:8080"
    WEAVIATE_API_KEY = "${{ secret() }}"
    RELYT_HOST = "db"
    RELYT_PORT = "5432"
    RELYT_USER = "${{ secret() }}"
    RELYT_PASSWORD = "${{ secret() }}"
    RELYT_DATABASE = "postgres"
    TIDB_VECTOR_HOST = "tidb"
    TIDB_VECTOR_PORT = "4000"
    TIDB_VECTOR_USER = "${{ secret() }}"
    TIDB_VECTOR_PASSWORD = "${{ secret() }}"
    TIDB_VECTOR_DATABASE = "dify"
    ANALYTICDB_NAMESPACE = "dify"
    TENCENT_VECTOR_DB_URL = "http://127.0.0.1"
    TENCENT_VECTOR_DB_API_KEY = "dify"
    TENCENT_VECTOR_DB_TIMEOUT = "30"
    TENCENT_VECTOR_DB_USERNAME = "dify"
    TENCENT_VECTOR_DB_DATABASE = "dify"
    TENCENT_VECTOR_DB_SHARD = "1"
    TENCENT_VECTOR_DB_REPLICAS = "2"
    UPLOAD_FILE_SIZE_LIMIT = "15"
    UPLOAD_FILE_BATCH_LIMIT = "5"
    ETL_TYPE = "dify"
    MULTIMODAL_SEND_IMAGE_FORMAT = "base64"
    UPLOAD_IMAGE_FILE_SIZE_LIMIT = "10"
    SENTRY_TRACES_SAMPLE_RATE = "1.0"
    SENTRY_PROFILES_SAMPLE_RATE = "1.0"
    NOTION_INTEGRATION_TYPE = "public"
    MAIL_TYPE = "resend"
    SMTP_PORT = "465"
    SMTP_USE_TLS = "true"
    SMTP_OPPORTUNISTIC_TLS = "false"
    RESEND_API_KEY = "your-resend-api-key"
    RESEND_API_URL = "https://api.resend.com"
    INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH = "1000"
    INVITE_EXPIRY_HOURS = "72"
    RESET_PASSWORD_TOKEN_EXPIRY_HOURS = "24"
    CODE_EXECUTION_ENDPOINT = "http://sandbox:8194"
    CODE_EXECUTION_API_KEY = "dify-sandbox"
    CODE_MAX_NUMBER = "9223372036854775807"
    CODE_MIN_NUMBER = "-9223372036854775808"
    CODE_MAX_STRING_LENGTH = "80000"
    TEMPLATE_TRANSFORM_MAX_LENGTH = "80000"
    CODE_MAX_STRING_ARRAY_LENGTH = "30"
    CODE_MAX_OBJECT_ARRAY_LENGTH = "30"
    CODE_MAX_NUMBER_ARRAY_LENGTH = "1000"
    SSRF_PROXY_HTTP_URL = "http://ssrf_proxy:3128"
    SSRF_PROXY_HTTPS_URL = "http://ssrf_proxy:3128"
    MODE = "api"
    [[services.storage]]
      host = "dify-storage"
      container = "/app/api/storage"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

