[[services]]
name = "web"
category = "app"
subtype = "docker"
docker_image = "langgenius/dify-web:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    CONSOLE_API_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    APP_API_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    NEXT_TELEMETRY_DISABLED = "0"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "db"
category = "database"
subtype = "postgres"
start_command = "postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'\n         -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'\n         -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'\n         -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'\n         -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'\n"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "${{ secret() }}"
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_DB = "dify"
    PGDATA = "/var/lib/postgresql/data/pgdata"
    [[services.storage]]
      host = "dify-db-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:6-alpine"
start_command = "redis-server --requirepass \"${{ secret() }}""
source = { type = "docker"  }
  [services.env]
    REDIS_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "dify-redis-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 30

[[services]]
name = "sandbox"
category = "app"
subtype = "docker"
docker_image = "langgenius/dify-sandbox:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    API_KEY = "dify-sandbox"
    GIN_MODE = "release"
    WORKER_TIMEOUT = "15"
    ENABLE_NETWORK = "true"
    HTTP_PROXY = "http://ssrf_proxy:3128"
    HTTPS_PROXY = "http://ssrf_proxy:3128"
    SANDBOX_PORT = "8194"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "ssrf_proxy"
category = "app"
subtype = "docker"
docker_image = "ubuntu/squid:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    HTTP_PORT = "3128"
    COREDUMP_DIR = "/var/spool/squid"
    REVERSE_PROXY_PORT = "8194"
    SANDBOX_HOST = "sandbox"
    SANDBOX_PORT = "8194"
    [[services.storage]]
      host = "ssrf_proxy_var_log_squid"
      container = "/var/log/squid"
    [[services.storage]]
      host = "ssrf_proxy_var_spool_squid"
      container = "/var/spool/squid"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "nginx"
category = "app"
subtype = "docker"
docker_image = "nginx:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    NGINX_SERVER_NAME = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    NGINX_HTTPS_ENABLED = "false"
    NGINX_SSL_PORT = "443"
    NGINX_PORT = "80"
    NGINX_SSL_CERT_FILENAME = "dify.crt"
    NGINX_SSL_CERT_KEY_FILENAME = "dify.key"
    NGINX_SSL_PROTOCOLS = "TLSv1.1 TLSv1.2 TLSv1.3"
    NGINX_WORKER_PROCESSES = "auto"
    NGINX_CLIENT_MAX_BODY_SIZE = "15M"
    NGINX_KEEPALIVE_TIMEOUT = "65"
    NGINX_PROXY_READ_TIMEOUT = "3600s"
    NGINX_PROXY_SEND_TIMEOUT = "3600s"
    NGINX_ENABLE_CERTBOT_CHALLENGE = "false"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "weaviate"
category = "app"
subtype = "docker"
docker_image = "semitechnologies/weaviate:1.19.0"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PERSISTENCE_DATA_PATH = "/var/lib/weaviate"
    QUERY_DEFAULTS_LIMIT = "25"
    AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED = "false"
    DEFAULT_VECTORIZER_MODULE = "none"
    CLUSTER_HOSTNAME = "node1"
    AUTHENTICATION_APIKEY_ENABLED = "true"
    AUTHENTICATION_APIKEY_ALLOWED_KEYS = "${{ secret() }}"
    AUTHENTICATION_APIKEY_USERS = "${{ secret() }}"
    AUTHORIZATION_ADMINLIST_ENABLED = "true"
    AUTHORIZATION_ADMINLIST_USERS = "${{ secret() }}"
    [[services.storage]]
      host = "dify-weaviate-data"
      container = "/var/lib/weaviate"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

