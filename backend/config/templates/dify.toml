[[services]]
name = "web"
category = "app"
subtype = "docker"
docker_image = "langgenius/dify-web:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_WEB_3000 = ""
    CONSOLE_API_URL = "${SERVICE_URL_WEB}"
    APP_API_URL = "${SERVICE_URL_API}"
    SENTRY_DSN = "${WEB_SENTRY_DSN:-}"
    NEXT_TELEMETRY_DISABLED = "${NEXT_TELEMETRY_DISABLED:-0}"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "db"
category = "database"
subtype = "postgres"
docker_image = "postgres:15-alpine"
start_command = "postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'\n         -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'\n         -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'\n         -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'\n         -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'\n"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "$SERVICE_USER_POSTGRES"
    POSTGRES_PASSWORD = "$SERVICE_PASSWORD_POSTGRES"
    POSTGRES_DB = "dify"
    PGDATA = "/var/lib/postgresql/data/pgdata"
    [[services.storage]]
      host = "dify-db-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:6-alpine"
start_command = "redis-server --requirepass \"$SERVICE_PASSWORD_REDIS\""
source = { type = "docker"  }
  [services.env]
    REDIS_PASSWORD = "$SERVICE_PASSWORD_REDIS"
    [[services.storage]]
      host = "dify-redis-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 30

[[services]]
name = "sandbox"
category = "app"
subtype = "docker"
docker_image = "langgenius/dify-sandbox:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    API_KEY = "${SANDBOX_API_KEY:-dify-sandbox}"
    GIN_MODE = "${SANDBOX_GIN_MODE:-release}"
    WORKER_TIMEOUT = "${SANDBOX_WORKER_TIMEOUT:-15}"
    ENABLE_NETWORK = "${SANDBOX_ENABLE_NETWORK:-true}"
    HTTP_PROXY = "${SANDBOX_HTTP_PROXY:-http://ssrf_proxy:3128}"
    HTTPS_PROXY = "${SANDBOX_HTTPS_PROXY:-http://ssrf_proxy:3128}"
    SANDBOX_PORT = "${SANDBOX_PORT:-8194}"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "ssrf_proxy"
category = "app"
subtype = "docker"
docker_image = "ubuntu/squid:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    HTTP_PORT = "${SSRF_HTTP_PORT:-3128}"
    COREDUMP_DIR = "${SSRF_COREDUMP_DIR:-/var/spool/squid}"
    REVERSE_PROXY_PORT = "${SSRF_REVERSE_PROXY_PORT:-8194}"
    SANDBOX_HOST = "${SSRF_SANDBOX_HOST:-sandbox}"
    SANDBOX_PORT = "${SANDBOX_PORT:-8194}"
    [[services.storage]]
      host = "ssrf_proxy_var_log_squid"
      container = "/var/log/squid"
    [[services.storage]]
      host = "ssrf_proxy_var_spool_squid"
      container = "/var/spool/squid"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "nginx"
category = "app"
subtype = "docker"
docker_image = "nginx:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    NGINX_SERVER_NAME = "$SERVICE_URL_NGINX"
    NGINX_HTTPS_ENABLED = "${NGINX_HTTPS_ENABLED:-false}"
    NGINX_SSL_PORT = "${NGINX_SSL_PORT:-443}"
    NGINX_PORT = "${NGINX_PORT:-80}"
    NGINX_SSL_CERT_FILENAME = "${NGINX_SSL_CERT_FILENAME:-dify.crt}"
    NGINX_SSL_CERT_KEY_FILENAME = "${NGINX_SSL_CERT_KEY_FILENAME:-dify.key}"
    NGINX_SSL_PROTOCOLS = "${NGINX_SSL_PROTOCOLS:-TLSv1.1 TLSv1.2 TLSv1.3}"
    NGINX_WORKER_PROCESSES = "${NGINX_WORKER_PROCESSES:-auto}"
    NGINX_CLIENT_MAX_BODY_SIZE = "${NGINX_CLIENT_MAX_BODY_SIZE:-15M}"
    NGINX_KEEPALIVE_TIMEOUT = "${NGINX_KEEPALIVE_TIMEOUT:-65}"
    NGINX_PROXY_READ_TIMEOUT = "${NGINX_PROXY_READ_TIMEOUT:-3600s}"
    NGINX_PROXY_SEND_TIMEOUT = "${NGINX_PROXY_SEND_TIMEOUT:-3600s}"
    NGINX_ENABLE_CERTBOT_CHALLENGE = "${NGINX_ENABLE_CERTBOT_CHALLENGE:-false}"
    CERTBOT_DOMAIN = "${CERTBOT_DOMAIN:-}"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "weaviate"
category = "app"
subtype = "docker"
docker_image = "semitechnologies/weaviate:1.19.0"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PERSISTENCE_DATA_PATH = "${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}"
    QUERY_DEFAULTS_LIMIT = "${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}"
    AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED = "${WEAVIATE_AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED:-false}"
    DEFAULT_VECTORIZER_MODULE = "${WEAVIATE_DEFAULT_VECTORIZER_MODULE:-none}"
    CLUSTER_HOSTNAME = "${WEAVIATE_CLUSTER_HOSTNAME:-node1}"
    AUTHENTICATION_APIKEY_ENABLED = "${WEAVIATE_AUTHENTICATION_APIKEY_ENABLED:-true}"
    AUTHENTICATION_APIKEY_ALLOWED_KEYS = "$SERVICE_PASSWORD_WEAVIATE"
    AUTHENTICATION_APIKEY_USERS = "$SERVICE_USER_WEAVIATE"
    AUTHORIZATION_ADMINLIST_ENABLED = "${WEAVIATE_AUTHORIZATION_ADMINLIST_ENABLED:-true}"
    AUTHORIZATION_ADMINLIST_USERS = "$SERVICE_USER_WEAVIATE"
    [[services.storage]]
      host = "dify-weaviate-data"
      container = "/var/lib/weaviate"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

