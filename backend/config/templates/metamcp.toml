name = "MCP Aggregator, Orchestrator, Middleware, Gateway in one app"
description = "MCP Aggregator, Orchestrator, Middleware, Gateway in one app"
category = "stack"
logo = "svgs/metamcp.png"
[[services]]
name = "app"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/metatool-ai/metamcp:2.4"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_METAMCP_12008 = ""
    POSTGRES_HOST = "${POSTGRES_HOST:-postgres}"
    POSTGRES_PORT = "${POSTGRES_PORT:-5432}"
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    POSTGRES_DB = "${POSTGRES_DB:-metamcp_db}"
    DATABASE_URL = "postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}"
    APP_URL = "${SERVICE_URL_METAMCP}"
    NEXT_PUBLIC_APP_URL = "${SERVICE_URL_METAMCP}"
    BETTER_AUTH_SECRET = "${SERVICE_PASSWORD_AUTH}"
    TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL = "${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:16-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_DB = "${POSTGRES_DB:-metamcp_db}"
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    [[services.storage]]
      host = "postgres_data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[links]]
from = "app"
to = "postgres"
