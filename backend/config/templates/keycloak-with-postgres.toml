name = "Keycloak is an open-source Identity and Access Management tool."
description = "Keycloak is an open-source Identity and Access Management tool."
category = "stack"
logo = "svgs/keycloak.svg"
[[services]]
name = "keycloak"
category = "app"
subtype = "docker"
docker_image = "quay.io/keycloak/keycloak:26.1"
start_command = "start"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_KEYCLOAK_8080 = ""
    TZ = "${TIMEZONE:-UTC}"
    KC_BOOTSTRAP_ADMIN_USERNAME = "${SERVICE_USER_ADMIN}"
    KC_BOOTSTRAP_ADMIN_PASSWORD = "${SERVICE_PASSWORD_ADMIN}"
    KC_DB = "postgres"
    KC_DB_USERNAME = "${SERVICE_USER_DATABASE}"
    KC_DB_PASSWORD = "${SERVICE_PASSWORD_64_DATABASE}"
    KC_DB_URL_PORT = "5432"
    KC_DB_URL = "jdbc:postgresql://postgres/${POSTGRESQL_DATABASE:-keycloak}"
    KC_HOSTNAME = "${SERVICE_URL_KEYCLOAK}"
    KC_HTTP_ENABLED = "${KC_HTTP_ENABLED:-true}"
    KC_HEALTH_ENABLED = "${KC_HEALTH_ENABLED:-true}"
    KC_PROXY_HEADERS = "${KC_PROXY_HEADERS:-xforwarded}"
    [[services.storage]]
      host = "keycloak-data"
      container = "/opt/keycloak/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:16-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "${SERVICE_USER_DATABASE}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_64_DATABASE}"
    POSTGRES_DB = "${POSTGRESQL_DATABASE:-keycloak}"
    [[services.storage]]
      host = "keycloak-postgresql-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "keycloak"
to = "postgres"
