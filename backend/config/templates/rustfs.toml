name = "Rustfs"
description = "RustFS is a high-performance distributed storage system built with Rust, compatible with Amazon S3 APIs."
category = "stack"
logo = "svgs/rustfs.png"

[[services]]
name = "rustfs"
category = "app"
subtype = "docker"
docker_image = "rustfs/rustfs:latest"
start_command = "/data"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    RUSTFS_SERVER_URL = "$RUSTFS_SERVER_URL"
    RUSTFS_BROWSER_REDIRECT_URL = "$RUSTFS_BROWSER_REDIRECT_URL"
    RUSTFS_ADDRESS = "0.0.0.0:9000"
    RUSTFS_CONSOLE_ADDRESS = "0.0.0.0:9001"
    RUSTFS_CORS_ALLOWED_ORIGINS = "*"
    RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS = "*"
    RUSTFS_ACCESS_KEY = "$SERVICE_USER_RUSTFS"
    RUSTFS_SECRET_KEY = "$SERVICE_PASSWORD_RUSTFS"
    RUSTFS_CONSOLE_ENABLE = "true"
    RUSTFS_SERVER_DOMAINS = "RUSTFS_SERVER_DOMAINS_VALUE"
    RUSTFS_EXTERNAL_ADDRESS = "RUSTFS_EXTERNAL_ADDRESS_VALUE"
    [[services.storage]]
      host = "rustfs-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20
