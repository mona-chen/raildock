name = "Wordpress With Mariadb"
description = "WordPress is open source software you can use to create a beautiful website, blog, or app."
category = "stack"
logo = "svgs/wordpress.svg"

[[services]]
name = "wordpress"
category = "app"
subtype = "docker"
docker_image = "wordpress:6-php8.3-apache"
source = { type = "docker" }
  [services.scaling]
    web = 1
  [services.env]
    # Database — the MariaDB service is linked below so the hostname
    # "mariadb" resolves via the project's Docker DNS.
    WORDPRESS_DB_HOST = "mariadb"
    WORDPRESS_DB_USER = "${{ linked.mariadb.MYSQL_USER }}"
    WORDPRESS_DB_PASSWORD = "${{ linked.mariadb.MYSQL_PASSWORD }}"
    WORDPRESS_DB_NAME = "${{ linked.mariadb.MYSQL_DATABASE }}"

    # Salt keys — each ${{ secret(64) }} generates a distinct random value.
    # wp-config.php is regenerated from env vars on every container start so
    # these are never persisted as files.
    WORDPRESS_AUTH_KEY = "${{ secret(64) }}"
    WORDPRESS_SECURE_AUTH_KEY = "${{ secret(64) }}"
    WORDPRESS_LOGGED_IN_KEY = "${{ secret(64) }}"
    WORDPRESS_NONCE_KEY = "${{ secret(64) }}"
    WORDPRESS_AUTH_SALT = "${{ secret(64) }}"
    WORDPRESS_SECURE_AUTH_SALT = "${{ secret(64) }}"
    WORDPRESS_LOGGED_IN_SALT = "${{ secret(64) }}"
    WORDPRESS_NONCE_SALT = "${{ secret(64) }}"

    # Domain — resolves to the service's public domain (e.g. skillmango.co
    # or skillmango-wordpress.185.202.238.221.sslip.io). Uses HTTPS because
    # $_SERVER["HTTPS"] is forced on below.
    WORDPRESS_HOME = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    WORDPRESS_SITEURL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"

    # WORDPRESS_DEBUG intentionally omitted. The Docker entrypoint uses
    # !!getenv_docker("WORDPRESS_DEBUG") which casts any non-empty string to
    # true (including the string "false"). Omission produces WP_DEBUG=false.

    # Hardening
    WORDPRESS_AUTO_UPDATE_CORE = "minor"
    WORDPRESS_AUTO_UPDATE_PLUGINS = "true"
    WORDPRESS_AUTO_UPDATE_THEMES = "true"
    WORDPRESS_DISALLOW_FILE_EDIT = "true"

    # Extra wp-config code. Runs as eval() in the generated wp-config.php,
    # before wp-settings.php loads.
    #   - ini_set display_errors — suppresses plugin-level PHP notices
    #   - $_SERVER["HTTPS"] — forces HTTPS behind Traefik/Cloudflare
    # Upload limits (upload_max_filesize, post_max_size) are PHP_INI_PERDIR
    # and can't be set at runtime. To increase them, add a storage mount for
    # a php.ini file in the Docker entrypoint config directory:
    #   storage mount host="wordpress-php" container="/usr/local/etc/php/conf.d"
    # then create a php.ini in the volume from the container's first start.
    WORDPRESS_CONFIG_EXTRA = 'define("DISALLOW_FILE_EDIT", true); define("DISALLOW_FILE_MODS", true); define("FS_METHOD", "direct"); if (isset($_SERVER["HTTP_X_FORWARDED_PROTO"])) { $_SERVER["HTTPS"]="on"; } ini_set("display_errors", "0"); error_reporting(0);'

    # Persist plugins, themes, uploads, so image tag upgrades don't wipe them.
    [[services.storage]]
      host = "wordpress-content"
      container = "/var/www/html/wp-content"

  [services.checks]
    enabled = true
    wait = 5
    timeout = 10
    path = "/wp-login.php"

  [services.resources]
    memory = "5120m"
    cpus = "2.0"

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
  [services.env]
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "wordpress"
    MYSQL_USER = "${{ secret() }}"
    MYSQL_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "wordpress-mariadb-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "wordpress"
to = "mariadb"
