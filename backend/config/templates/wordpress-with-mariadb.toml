name = "Wordpress With Mariadb"
description = "WordPress is open source software you can use to create a beautiful website, blog, or app."
category = "stack"
logo = "svgs/wordpress.svg"

[[services]]
name = "wordpress"
category = "app"
subtype = "docker"
docker_image = "wordpress:6-php8.3-apache"
source = { type = "docker" }
  [services.scaling]
    web = 1
  [services.env]
    # Database — comes from the linked mariadb service below
    WORDPRESS_DB_HOST = "mariadb"
    WORDPRESS_DB_USER = "${{ linked.mariadb.MYSQL_USER }}"
    WORDPRESS_DB_PASSWORD = "${{ linked.mariadb.MYSQL_PASSWORD }}"
    WORDPRESS_DB_NAME = "wordpress"

    # wp-config.php is regenerated by the official entrypoint on every fresh
    # container from these env vars. Persisting it as a file is unnecessary —
    # all of its content is expressed here. Salt keys are auto-generated
    # by the manifest parser via ${{ secret() }} — each env value gets a
    # fresh parser, so the eight keys below resolve to eight distinct
    # values. Table prefix is fixed at the upstream default `wp_`; change
    # it in a custom image before first deploy if you need a different
    # prefix.
    WORDPRESS_AUTH_KEY = "${{ secret(64) }}"
    WORDPRESS_SECURE_AUTH_KEY = "${{ secret(64) }}"
    WORDPRESS_LOGGED_IN_KEY = "${{ secret(64) }}"
    WORDPRESS_NONCE_KEY = "${{ secret(64) }}"
    WORDPRESS_AUTH_SALT = "${{ secret(64) }}"
    WORDPRESS_SECURE_AUTH_SALT = "${{ secret(64) }}"
    WORDPRESS_LOGGED_IN_SALT = "${{ secret(64) }}"
    WORDPRESS_NONCE_SALT = "${{ secret(64) }}"
    WORDPRESS_HOME = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    WORDPRESS_SITEURL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    WORDPRESS_DEBUG = "false"

    # Hardening
    WORDPRESS_AUTO_UPDATE_CORE = "minor"
    WORDPRESS_AUTO_UPDATE_PLUGINS = "true"
    WORDPRESS_AUTO_UPDATE_THEMES = "true"
    WORDPRESS_DISALLOW_FILE_EDIT = "true"
    WORDPRESS_CONFIG_EXTRA = "define('AUTOMATIC_UPDATER_DISABLED', false); define('WP_AUTO_UPDATE_CORE', 'minor'); define('DISALLOW_FILE_EDIT', true); define('FS_METHOD', 'direct');"

    # Persist plugins, themes, uploads, mu-plugins. Core files
    # (wp-includes, wp-admin) live in the image so image tag upgrades
    # apply naturally on the next deploy.
    [[services.storage]]
      host = "wordpress-content"
      container = "/var/www/html/wp-content"

  [services.checks]
    enabled = true
    wait = 5
    timeout = 10
    path = "/wp-login.php"

  [services.resources]
    memory = "512m"
    cpus = "0.5"

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
  [services.env]
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "wordpress"
    MYSQL_USER = "${{ secret() }}"
    MYSQL_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "wordpress-mariadb-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "wordpress"
to = "mariadb"
