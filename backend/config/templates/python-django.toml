name = "Python Django"
description = "Django application with PostgreSQL"
category = "stack"

[[services]]
name = "web"
category = "app"
subtype = "python"
builder = "nixpacks"
source = { type = "git" }

  [services.scaling]
  web = 1

  [services.env]
  PYTHONUNBUFFERED = "1"
  DJANGO_SETTINGS_MODULE = "app.settings.production"

  [services.proxy]
  enabled = true
  type = "traefik"

    [[services.proxy.ports]]
    host = 80
    container = 8000

[[services]]
name = "database"
category = "database"
subtype = "postgres"
version = "16"

[[links]]
from = "web"
to = "database"
