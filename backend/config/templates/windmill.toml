category = "app"
subtype = "docker"
docker_image = "ghcr.io/windmill-labs/windmill:main"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DATABASE_URL = "postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db/${POSTGRES_DB:-windmill-db}"
    MODE = "worker"
    WORKER_GROUP = "native"
    NUM_WORKERS = "8"
    SLEEP_QUEUE = "200"
    [[services.storage]]
      host = "worker-logs"
      container = "/tmp/windmill/logs"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "lsp"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/windmill-labs/windmill-lsp:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
    [[services.storage]]
      host = "lsp-cache"
      container = "/root/.cache"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

