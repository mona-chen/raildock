name = "A GitHub Actions runner for Docker"
description = "A GitHub Actions runner for Docker"
category = "stack"
logo = "svgs/github-runner.png"
[[services]]
name = "runner"
category = "app"
subtype = "docker"
docker_image = "myoung34/github-runner:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    REPO_URL = "${REPO_URL}"
    RUNNER_NAME_PREFIX = "${RUNNER_NAME_PREFIX:-coolify-runner}"
    RUNNER_NAME_SUFFIX = "${RUNNER_NAME_SUFFIX:-false}"
    ACCESS_TOKEN = "${ACCESS_TOKEN}"
    RUNNER_WORKDIR = "/runner/work"
    RUNNER_SCOPE = "${RUNNER_SCOPE:-repo}"
    LABELS = "${LABELS:-default}"
    ORG_NAME = "${ORG_NAME}"
    [[services.storage]]
      host = "runner-data"
      container = "/runner"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10
