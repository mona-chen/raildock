name = "Nodebb"
description = "A next-generation discussion platform."
category = "stack"
logo = "svgs/nodebb.svg"

[[services]]
name = "nodebb"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/nodebb/nodebb:latest"
start_command = "bash -c \"cat > /usr/src/app/setup.json <<EOL\n{\"defaults\": {\"postgres\": {\"host\": \"postgres\",\"port\": 5432,\"database\": \"nodebb\",\"username\": \"${{ secret() }}\",\"password\": \"${{ secret() }}\"}}\n} EOL && tini -- entrypoint.sh \""
source = { type = "docker"  }
  [services.scaling]
    web = 1
    [[services.storage]]
      host = "nodebb_build"
      container = "/usr/src/app/build"
    [[services.storage]]
      host = "nodebb_uploads"
      container = "/usr/src/app/public/uploads"
    [[services.storage]]
      host = "nodebb_config"
      container = "/opt/config"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRES_USER = "${{ secret() }}"
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_DB = "nodebb"
    [[services.storage]]
      host = "nodebb_postgres_data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "nodebb"
to = "postgres"