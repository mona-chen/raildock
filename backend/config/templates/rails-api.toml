name = "Rails API"
description = "Ruby on Rails API with PostgreSQL and Redis"
category = "stack"

[[services]]
name = "web"
category = "app"
subtype = "rails"
builder = "nixpacks"
source = { type = "git" }

  [services.scaling]
  web = 1

  [services.env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_SERVE_STATIC_FILES = "true"

  [services.proxy]
  enabled = true
  type = "traefik"

    [[services.proxy.ports]]
    host = 80
    container = 3000

[[services]]
name = "database"
category = "database"
subtype = "postgres"
version = "16"

[[services]]
name = "cache"
category = "cache"
subtype = "redis"

[[links]]
from = "web"
to = "database"

[[links]]
from = "web"
to = "cache"
