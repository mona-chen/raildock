name = "Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content."
description = "Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content."
category = "stack"
logo = "svgs/directus.svg"
[[services]]
name = "directus"
category = "app"
subtype = "docker"
docker_image = "directus/directus:11"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_DIRECTUS_8055 = ""
    KEY = "$SERVICE_BASE64_64_KEY"
    SECRET = "$SERVICE_BASE64_64_SECRET"
    ADMIN_EMAIL = "${ADMIN_EMAIL:-admin@example.com}"
    ADMIN_PASSWORD = "$SERVICE_PASSWORD_ADMIN"
    DB_CLIENT = "sqlite3"
    DB_FILENAME = "/directus/database/data.db"
    WEBSOCKETS_ENABLED = "true"
    CORS_ENABLED = "${CORS_ENABLED:-true}"
    CORS_ORIGIN = "${CORS_ORIGIN}"
    CORS_METHODS = "${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}"
    CORS_ALLOWED_HEADERS = "${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}"
    CORS_CREDENTIALS = "${CORS_CREDENTIALS:-true}"
    [[services.storage]]
      host = "directus-database"
      container = "/directus/database"
    [[services.storage]]
      host = "directus-uploads"
      container = "/directus/uploads"
    [[services.storage]]
      host = "directus-extensions"
      container = "/directus/extensions"
    [[services.storage]]
      host = "directus-templates"
      container = "/directus/templates"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20
