name = "Prefect"
description = "Prefect is an orchestration and observability platform that empowers developers to build and scale workflows quickly."
category = "stack"
logo = "svgs/prefect.png"

[[services]]
name = "prefect"
category = "app"
subtype = "docker"
docker_image = "prefecthq/prefect:3-latest"
start_command = "prefect server start --host 0.0.0.0 --port 4200"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PREFECT_API_URL = "https://example.com/api"
    PREFECT_API_DATABASE_CONNECTION_URL = "postgresql+asyncpg://user:CHANGE_ME@postgresql:5432/prefect"
    PREFECT_API_KEY = "CHANGE_ME"
    PREFECT_EXPERIMENTAL_WARN = "false"
    PREFECT_EXPERIMENTAL_ENABLE_SCHEDULE_CONCURRENCY = "false"
    PREFECT_RUNNER_SERVER_ENABLE = "false"
    PREFECT_DEFAULT_WORK_POOL_NAME = "default"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[services]]
name = "postgresql"
category = "database"
subtype = "postgres"
docker_image = "postgres:16-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "$SERVICE_USER_POSTGRES"
    POSTGRES_PASSWORD = "$SERVICE_PASSWORD_POSTGRES"
    POSTGRES_DB = "prefect"
    [[services.storage]]
      host = "pg-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[services]]
name = "agent"
category = "app"
subtype = "docker"
docker_image = "prefecthq/prefect:3-python3.12"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PREFECT_API_URL = "http://prefect:4200/api"
    PREFECT_API_KEY = "CHANGE_ME"
    DEFAULT_POOL_NAME = "default"
    DEFAULT_POOL_LIMIT = "1"
    DEFAULT_WORKER_NAME = "worker1"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[links]]
from = "prefect"
to = "postgresql"

[[links]]
from = "agent"
to = "prefect"

[[links]]
from = "agent"
to = "postgresql"
