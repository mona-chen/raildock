name = "Share sensitive information securely with self-destructing links that are only viewable once."
description = "Share sensitive information securely with self-destructing links that are only viewable once."
category = "stack"
logo = "svgs/onetimesecret.svg"
[[services]]
name = "onetimesecret"
category = "app"
subtype = "docker"
docker_image = "onetimesecret/onetimesecret:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_ONETIMESECRET_3000 = ""
    AUTH_AUTOVERIFY = "${AUTH_AUTOVERIFY:-true}"
    AUTH_SIGNUP = "${AUTH_SIGNUP:-true}"
    COLONEL = "${COLONEL:-admin@example.com}"
    HOST = "${HOST:-localhost}"
    REDIS_URL = "redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0"
    SECRET = "${SERVICE_PASSWORD_ONETIMESECRET}"
    SSL = "${SSL:-false}"
    RACK_ENV = "production"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:8-alpine"
start_command = "redis-server --requirepass ${SERVICE_PASSWORD_REDIS}"
source = { type = "docker"  }
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[links]]
from = "onetimesecret"
to = "redis"
