name = "Onetimesecret"
description = "Share sensitive information securely with self-destructing links that are only viewable once."
category = "stack"
logo = "svgs/onetimesecret.svg"

[[services]]
name = "onetimesecret"
category = "app"
subtype = "docker"
docker_image = "onetimesecret/onetimesecret:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    AUTH_AUTOVERIFY = "true"
    AUTH_SIGNUP = "true"
    COLONEL = "admin@example.com"
    HOST = "localhost"
    REDIS_URL = "redis://:CHANGE_ME@redis:6379/0"
    SECRET = "${{ secret() }}"
    SSL = "false"
    RACK_ENV = "production"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:8-alpine"
start_command = "redis-server --requirepass ${SERVICE_PASSWORD_REDIS}"
source = { type = "docker"  }
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[links]]
from = "onetimesecret"
to = "redis"
