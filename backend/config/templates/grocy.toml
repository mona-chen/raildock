name = "Grocy"
description = "Grocy is a web-based household management and grocery list application."
category = "stack"
logo = "svgs/grocy.svg"

[[services]]
name = "grocy"
category = "app"
subtype = "docker"
docker_image = "lscr.io/linuxserver/grocy:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PUID = "1000"
    PGID = "1000"
    TZ = "Europe/Madrid"
    [[services.storage]]
      host = "grocy-config"
      container = "/config"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
