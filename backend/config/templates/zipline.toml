name = "A ShareX/file upload server that is easy to use, packed with features, and with an easy setup!"
description = "A ShareX/file upload server that is easy to use, packed with features, and with an easy setup!"
category = "stack"
logo = "svgs/zipline.png"
[[services]]
name = "zipline"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/diced/zipline:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_ZIPLINE_3000 = ""
    CORE_RETURN_HTTPS = "${CORE_RETURN_HTTPS:-false}"
    CORE_SECRET = "${SERVICE_PASSWORD_64_ZIPLINE}"
    DATABASE_URL = "postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres/${POSTGRES_DB:-zipline-db}"
    CORE_LOGGER = "${CORE_LOGGER:-true}"
    [[services.storage]]
      host = "zipline-uploads"
      container = "/zipline/uploads"
    [[services.storage]]
      host = "zipline-public"
      container = "/zipline/public"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:16-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "${SERVICE_USER_POSTGRES}"
    POSTGRES_PASSWORD = "${SERVICE_PASSWORD_POSTGRES}"
    POSTGRES_DB = "${POSTGRES_DB:-zipline-db}"
    [[services.storage]]
      host = "zipline-postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "zipline"
to = "postgres"
