name = "Wikijs"
description = "The most powerful and extensible open source Wiki software."
category = "stack"
logo = "svgs/wikijs.svg"

[[services]]
name = "wikijs"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/requarks/wiki:2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DB_TYPE = "postgres"
    DB_PASS = "${{ linked.postgres.POSTGRES_PASSWORD }}"
    DB_NAME = "wiki-db"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 30

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRES_DB = "wiki-db"
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_USER = "${{ secret() }}"
    [[services.storage]]
      host = "wikijs-postgresql-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "wikijs"
to = "postgres"