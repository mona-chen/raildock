name = "Imgcompress"
description = "Offline image compression, conversion, and AI background removal for Docker homelabs."
category = "stack"
logo = "svgs/imgcompress.png"

[[services]]
name = "imgcompress"
category = "app"
subtype = "docker"
docker_image = "karimz1/imgcompress:0.6.0"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DISABLE_LOGO = "false"
    DISABLE_STORAGE_MANAGEMENT = "false"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10
