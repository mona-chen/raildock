name = "Openclaw"
description = "AI-powered coding assistant with multi-provider support and browser automation."
category = "stack"
logo = "svgs/openclaw.svg"

[[services]]
name = "openclaw"
category = "app"
subtype = "docker"
docker_image = "coollabsio/openclaw:2026.2.6"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    AUTH_USERNAME = "$SERVICE_USER_OPENCLAW"
    AUTH_PASSWORD = "$SERVICE_PASSWORD_OPENCLAW"
    OPENCLAW_GATEWAY_TOKEN = "$SERVICE_PASSWORD_64_GATEWAYTOKEN"
    ANTHROPIC_API_KEY = "${{ secret() }}"
    OPENAI_API_KEY = "${{ secret() }}"
    OPENROUTER_API_KEY = "${{ secret() }}"
    GEMINI_API_KEY = "${{ secret() }}"
    XAI_API_KEY = "${{ secret() }}"
    GROQ_API_KEY = "${{ secret() }}"
    MISTRAL_API_KEY = "${{ secret() }}"
    CEREBRAS_API_KEY = "${{ secret() }}"
    VENICE_API_KEY = "${{ secret() }}"
    MOONSHOT_API_KEY = "${{ secret() }}"
    KIMI_API_KEY = "${{ secret() }}"
    MINIMAX_API_KEY = "${{ secret() }}"
    ZAI_API_KEY = "${{ secret() }}"
    AI_GATEWAY_API_KEY = "${{ secret() }}"
    OPENCODE_API_KEY = "${{ secret() }}"
    SYNTHETIC_API_KEY = "${{ secret() }}"
    COPILOT_GITHUB_TOKEN = "${{ secret() }}"
    XIAOMI_API_KEY = "${{ secret() }}"
    OPENCLAW_PRIMARY_MODEL = "OPENCLAW_PRIMARY_MODEL_VALUE"
    DEEPGRAM_API_KEY = "${{ secret() }}"
    AWS_ACCESS_KEY_ID = "${{ secret() }}"
    AWS_SECRET_ACCESS_KEY = "${{ secret() }}"
    AWS_REGION = "us-east-1"
    AWS_SESSION_TOKEN = "${{ secret() }}"
    BEDROCK_PROVIDER_FILTER = "anthropic"
    OLLAMA_BASE_URL = "https://example.com"
    PORT = "8080"
    OPENCLAW_GATEWAY_PORT = "18789"
    OPENCLAW_GATEWAY_BIND = "loopback"
    OPENCLAW_STATE_DIR = "/data/.openclaw"
    OPENCLAW_WORKSPACE_DIR = "/data/workspace"
    BROWSER_CDP_URL = "http://browser:9223"
    BROWSER_DEFAULT_PROFILE = "openclaw"
    BROWSER_EVALUATE_ENABLED = "true"
    BROWSER_SNAPSHOT_MODE = "efficient"
    BROWSER_REMOTE_TIMEOUT_MS = "1500"
    BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS = "3000"
    HOOKS_ENABLED = "false"
    HOOKS_PATH = "/hooks"
    MOONSHOT_BASE_URL = "https://api.moonshot.ai/v1"
    KIMI_BASE_URL = "https://api.moonshot.ai/anthropic"
    TELEGRAM_BOT_TOKEN = "$TELEGRAM_BOT_TOKEN"
    DISCORD_BOT_TOKEN = "$DISCORD_BOT_TOKEN"
    SLACK_BOT_TOKEN = "$SLACK_BOT_TOKEN"
    SLACK_APP_TOKEN = "$SLACK_APP_TOKEN"
    WHATSAPP_ENABLED = "$WHATSAPP_ENABLED"
    OPENCLAW_DOCKER_APT_PACKAGES = "$OPENCLAW_DOCKER_APT_PACKAGES"
    [[services.storage]]
      host = "openclaw-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 10

[[services]]
name = "browser"
category = "app"
subtype = "docker"
docker_image = "coollabsio/openclaw-browser:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PUID = "1000"
    PGID = "1000"
    TZ = "Etc/UTC"
    CHROME_CLI = "--remote-debugging-port=9222"
    [[services.storage]]
      host = "browser-data"
      container = "/config"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[links]]
from = "openclaw"
to = "browser"
