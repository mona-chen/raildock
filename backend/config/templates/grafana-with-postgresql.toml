name = "Grafana With Postgresql"
description = "Grafana is the open source analytics & monitoring solution for every database."
category = "stack"
logo = "svgs/grafana.svg"

[[services]]
name = "grafana"
category = "app"
subtype = "docker"
docker_image = "grafana/grafana-oss"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    GF_SERVER_ROOT_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    GF_SERVER_DOMAIN = "${{ RAILDOCK_PUBLIC_DOMAIN }}"
    GF_SECURITY_ADMIN_PASSWORD = "${{ secret() }}"
    GF_DATABASE_TYPE = "postgres"
    GF_DATABASE_HOST = "postgresql"
    GF_DATABASE_USER = "${{ linked.postgresql.POSTGRES_USER }}"
    GF_DATABASE_PASSWORD = "${{ linked.postgresql.POSTGRES_PASSWORD }}"
    GF_DATABASE_NAME = "grafana"
    [[services.storage]]
      host = "grafana-data"
      container = "/var/lib/grafana"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "postgresql"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRES_USER = "${{ secret() }}"
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_DB = "grafana"
    [[services.storage]]
      host = "postgresql-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "grafana"
to = "postgresql"