name = "Grafana is the open source analytics & monitoring solution for every database."
description = "Grafana is the open source analytics & monitoring solution for every database."
category = "stack"
logo = "svgs/grafana.svg"
[[services]]
name = "grafana"
category = "app"
subtype = "docker"
docker_image = "grafana/grafana-oss"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_GRAFANA_3000 = ""
    GF_SERVER_ROOT_URL = "${SERVICE_URL_GRAFANA}"
    GF_SERVER_DOMAIN = "${SERVICE_FQDN_GRAFANA}"
    GF_SECURITY_ADMIN_PASSWORD = "${SERVICE_PASSWORD_GRAFANA}"
    GF_DATABASE_TYPE = "postgres"
    GF_DATABASE_HOST = "postgresql"
    GF_DATABASE_USER = "$SERVICE_USER_POSTGRES"
    GF_DATABASE_PASSWORD = "$SERVICE_PASSWORD_POSTGRES"
    GF_DATABASE_NAME = "${POSTGRES_DB:-grafana}"
    [[services.storage]]
      host = "grafana-data"
      container = "/var/lib/grafana"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "postgresql"
category = "database"
subtype = "postgres"
docker_image = "postgres:16-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "$SERVICE_USER_POSTGRES"
    POSTGRES_PASSWORD = "$SERVICE_PASSWORD_POSTGRES"
    POSTGRES_DB = "${POSTGRES_DB:-grafana}"
    [[services.storage]]
      host = "postgresql-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "grafana"
to = "postgresql"
