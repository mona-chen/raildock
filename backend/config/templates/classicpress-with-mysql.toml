name = "Classicpress With Mysql"
description = "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
category = "stack"
logo = "svgs/classicpress.svg"

[[services]]
name = "classicpress"
category = "app"
subtype = "docker"
docker_image = "classicpress/classicpress:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    CLASSICPRESS_DB_HOST = "mysql"
    CLASSICPRESS_DB_USER = "$SERVICE_USER_CLASSICPRESS"
    CLASSICPRESS_DB_PASSWORD = "$SERVICE_PASSWORD_CLASSICPRESS"
    CLASSICPRESS_DB_NAME = "classicpress"
    [[services.storage]]
      host = "classicpress-files"
      container = "/var/www/html"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "mysql"
category = "database"
subtype = "mysql"
docker_image = "mysql:8"
source = { type = "docker"  }
  [services.env]
    MYSQL_ROOT_PASSWORD = "$SERVICE_PASSWORD_ROOT"
    MYSQL_DATABASE = "classicpress"
    MYSQL_USER = "$SERVICE_USER_CLASSICPRESS"
    MYSQL_PASSWORD = "$SERVICE_PASSWORD_CLASSICPRESS"
    [[services.storage]]
      host = "mysql-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "classicpress"
to = "mysql"
