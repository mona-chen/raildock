name = "Supertokens With Postgresql"
description = "An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications."
category = "stack"
logo = "svgs/supertokens.svg"

[[services]]
name = "supertokens"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRESQL_CONNECTION_URI = "\"postgresql://${{ linked.postgres.POSTGRES_USER }}:${{ linked.postgres.POSTGRES_PASSWORD }}@postgres:5432/supertokens\""
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
  [services.env]
    POSTGRES_USER = "${{ secret() }}"
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_DB = "supertokens"
    [[services.storage]]
      host = "supertokens-postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[links]]
from = "supertokens"
to = "postgres"