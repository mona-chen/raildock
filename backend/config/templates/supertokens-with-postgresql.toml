name = "An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications."
description = "An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications."
category = "stack"
logo = "svgs/supertokens.svg"
[[services]]
name = "supertokens"
category = "database"
subtype = "postgres"
docker_image = "registry.supertokens.io/supertokens/supertokens-postgresql:latest"
source = { type = "docker"  }
  [services.env]
    SERVICE_URL_SUPERTOKENS_3567 = ""
    API_KEYS = "${API_KEYS:-}"
    POSTGRESQL_CONNECTION_URI = "\"postgresql://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRES_DB:-supertokens}\""
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:16"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "$SERVICE_USER_POSTGRESQL"
    POSTGRES_PASSWORD = "$SERVICE_PASSWORD_POSTGRESQL"
    POSTGRES_DB = "${POSTGRES_DB:-supertokens}"
    [[services.storage]]
      host = "supertokens-postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[links]]
from = "supertokens"
to = "postgres"
