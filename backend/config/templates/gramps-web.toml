name = "Gramps Web"
description = "Open Source Online Genealogy System."
category = "stack"
logo = "svgs/gramps-web.svg"

[[services]]
name = "grampsweb"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/gramps-project/grampsweb:25.9.0"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    GRAMPSWEB_TREE = "Gramps Web"
    GRAMPSWEB_CELERY_CONFIG__broker_url = "redis://grampsweb_redis:6379/0"
    GRAMPSWEB_CELERY_CONFIG__result_backend = "redis://grampsweb_redis:6379/0"
    GRAMPSWEB_RATELIMIT_STORAGE_URI = "redis://grampsweb_redis:6379/1"
    GUNICORN_NUM_WORKERS = "2"
    [[services.storage]]
      host = "gramps_users"
      container = "/app/users"
    [[services.storage]]
      host = "gramps_index"
      container = "/app/indexdir"
    [[services.storage]]
      host = "gramps_thumb_cache"
      container = "/app/thumbnail_cache"
    [[services.storage]]
      host = "gramps_cache"
      container = "/app/cache"
    [[services.storage]]
      host = "gramps_secret"
      container = "/app/secret"
    [[services.storage]]
      host = "gramps_db"
      container = "/root/.gramps/grampsdb"
    [[services.storage]]
      host = "gramps_media"
      container = "/app/media"
    [[services.storage]]
      host = "gramps_tmp"
      container = "/tmp"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[services]]
name = "grampsweb_celery"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/gramps-project/grampsweb:25.9.0"
start_command = "celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    GRAMPSWEB_TREE = "Gramps Web"
    GRAMPSWEB_CELERY_CONFIG__broker_url = "redis://grampsweb_redis:6379/0"
    GRAMPSWEB_CELERY_CONFIG__result_backend = "redis://grampsweb_redis:6379/0"
    GRAMPSWEB_RATELIMIT_STORAGE_URI = "redis://grampsweb_redis:6379/1"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[services]]
name = "grampsweb_redis"
category = "cache"
subtype = "redis"
docker_image = "docker.io/library/redis:7.2.4-alpine"
source = { type = "docker"  }
  [services.checks]
    enabled = true
    wait = 5
    timeout = 10

[[links]]
from = "grampsweb"
to = "grampsweb_redis"

[[links]]
from = "grampsweb_celery"
to = "grampsweb_redis"
