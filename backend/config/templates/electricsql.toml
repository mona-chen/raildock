name = "Electricsql"
description = "Sync shape-based subsets of your Postgres data over HTTP."
category = "stack"
logo = "svgs/electricsql.svg"

[[services]]
name = "electric"
category = "app"
subtype = "docker"
docker_image = "electricsql/electric:1.4.2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DATABASE_URL = "${DATABASE_URL:?}"
    ELECTRIC_SECRET = "${{ secret() }}"
    ELECTRIC_STORAGE_DIR = "/app/persistent"
    ELECTRIC_USAGE_REPORTING = "false"
    [[services.storage]]
      host = "electric_data"
      container = "/app/persistent"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5
