name = "Mautic5"
description = "Mautic v5 Open Source Marketing Automation"
category = "stack"
logo = "svgs/mautic.svg"

[[services]]
name = "mysql"
category = "database"
subtype = "mysql"
docker_image = "mysql:8.0"
source = { type = "docker"  }
  [services.env]
    MYSQL_ROOT_PASSWORD = "CHANGE_ME"
    MYSQL_DATABASE = "mautic"
    MYSQL_USER = "user"
    MYSQL_PASSWORD = "CHANGE_ME"
    [[services.storage]]
      host = "mysql-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 5

[[services]]
name = "rabbitmq"
category = "queue"
subtype = "rabbitmq"
docker_image = "rabbitmq:3"
source = { type = "docker"  }
  [services.env]
    RABBITMQ_DEFAULT_VHOST = "mautic"
    [[services.storage]]
      host = "rabbitmq-data"
      container = "/var/lib/rabbitmq"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 30

[[services]]
name = "mautic_web"
category = "app"
subtype = "docker"
docker_image = "mautic/mautic:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DOCKER_MAUTIC_LOAD_TEST_DATA = "false"
    DOCKER_MAUTIC_RUN_MIGRATIONS = "false"
    MAUTIC_DB_HOST = "mysql"
    MAUTIC_DB_PORT = "3306"
    MAUTIC_DB_DATABASE = "mautic"
    MAUTIC_DB_USER = "user"
    MAUTIC_DB_PASSWORD = "CHANGE_ME"
    MAUTIC_MESSENGER_DSN_EMAIL = "amqp://guest:guest@rabbitmq:5672/mautic/messages"
    MAUTIC_MESSENGER_DSN_HIT = "amqp://guest:guest@rabbitmq:5672/mautic/messages"
    [[services.storage]]
      host = "mautic_data/config"
      container = "/var/www/html/config"
    [[services.storage]]
      host = "mautic_data/logs"
      container = "/var/www/html/var/logs"
    [[services.storage]]
      host = "mautic_data/media/files"
      container = "/var/www/html/docroot/media/files"
    [[services.storage]]
      host = "mautic_data/media/images"
      container = "/var/www/html/docroot/media/images"
    [[services.storage]]
      host = "mautic_data/plugins"
      container = "/var/www/html/docroot/plugins"
    [[services.storage]]
      host = "mautic_data/vendor"
      container = "/var/www/html/vendor"
    [[services.storage]]
      host = "mautic_data/bin"
      container = "/var/www/html/bin"
    [[services.storage]]
      host = "mautic_data/cron"
      container = "/opt/mautic/cron"
  [services.checks]
    enabled = true
    wait = 15
    timeout = 10

