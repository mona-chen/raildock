name = "Keycloak"
description = "Keycloak is an open-source Identity and Access Management tool."
category = "stack"
logo = "svgs/keycloak.svg"

[[services]]
name = "keycloak"
category = "app"
subtype = "docker"
docker_image = "quay.io/keycloak/keycloak:26.1"
start_command = "start"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    TZ = "UTC"
    KC_BOOTSTRAP_ADMIN_USERNAME = "user"
    KC_BOOTSTRAP_ADMIN_PASSWORD = "CHANGE_ME"
    KC_HOSTNAME = "https://example.com"
    KC_HTTP_ENABLED = "true"
    KC_HEALTH_ENABLED = "true"
    KC_PROXY_HEADERS = "xforwarded"
    [[services.storage]]
      host = "keycloak-data"
      container = "/opt/keycloak/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20
