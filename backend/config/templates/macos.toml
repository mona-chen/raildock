name = "Macos"
description = "Run macOS in a containerized environment."
category = "stack"
logo = "svgs/macos.svg"

[[services]]
name = "macos"
category = "app"
subtype = "docker"
docker_image = "dockurr/macos"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    VERSION = "15"
    [[services.storage]]
      host = "macos-storage"
      container = "/storage"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
