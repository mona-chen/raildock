name = "Radarr"
description = "Radarr⁠ - A fork of Sonarr to work with movies à la Couchpotato."
category = "stack"
logo = "svgs/radarr.svg"

[[services]]
name = "radarr"
category = "app"
subtype = "docker"
docker_image = "lscr.io/linuxserver/radarr:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    _APP_URL = "$SERVICE_URL_RADARR"
    PUID = "1000"
    PGID = "1000"
    TZ = "America/Toronto"
    [[services.storage]]
      host = "radarr-config"
      container = "/config"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
