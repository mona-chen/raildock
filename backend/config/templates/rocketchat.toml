name = "Rocketchat"
description = "Self-hosted, secure and highly customizable open-source communication platform for organizations with sophisticated security and privacy concerns."
category = "stack"
logo = "svgs/rocketchat.svg"

[[services]]
name = "rocketchat"
category = "app"
subtype = "docker"
docker_image = "registry.rocket.chat/rocketchat/rocket.chat:8.0.1"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    MONGO_URL = "mongodb://mongodb:27017/rocketchat?replicaSet=rs0"
    MONGO_OPLOG_URL = "mongodb://mongodb:27017/local?replicaSet=rs0"
    ROOT_URL = "$SERVICE_URL_ROCKETCHAT"
    DEPLOY_METHOD = "docker"
    REG_TOKEN = "$REG_TOKEN"
    MAIL_URL = "test@example.com"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "mongodb"
category = "database"
subtype = "mongo"
start_command = "sh -c \"\n  mongod --replSet ${MONGODB_REPLICA_SET_NAME:-rs0} --bind_ip_all &\n  sleep 5 &&\n  mongosh --eval 'rs.initiate({_id:\\"${MONGODB_REPLICA_SET_NAME:-rs0}\\", members:[{_id:0, host:\\"mongodb:27017\\"}]})' ||\n  true &&\n  wait\n\"\n"
source = { type = "docker"  }
    [[services.storage]]
      host = "mongodb_data"
      container = "/data/db"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[links]]
from = "rocketchat"
to = "mongodb"