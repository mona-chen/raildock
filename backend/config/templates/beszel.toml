name = "Beszel"
description = "A lightweight server resource monitoring hub with historical data, docker stats, and alerts."
category = "stack"
logo = "svgs/beszel.svg"

[[services]]
name = "beszel"
category = "app"
subtype = "docker"
docker_image = "henrygd/beszel:0.18.7"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    CONTAINER_DETAILS = "true"
    SHARE_ALL_SYSTEMS = "false"
    [[services.storage]]
      host = "beszel_data"
      container = "/beszel_data"
    [[services.storage]]
      host = "beszel_socket"
      container = "/beszel_socket"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 20

[[services]]
name = "beszel-agent"
category = "app"
subtype = "docker"
docker_image = "henrygd/beszel-agent:0.18.7"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    LISTEN = "/beszel_socket/beszel.sock"
    HUB_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    TOKEN = "${{ secret() }}"
    KEY = "${{ secret() }}"
    DISABLE_SSH = "false"
    LOG_LEVEL = "warn"
    SKIP_GPU = "false"
    SYSTEM_NAME = "SYSTEM_NAME_VALUE"
    [[services.storage]]
      host = "beszel_agent_data"
      container = "/var/lib/beszel-agent"
    [[services.storage]]
      host = "beszel_socket"
      container = "/beszel_socket"
  [services.checks]
    enabled = true
    wait = 60
    timeout = 20
