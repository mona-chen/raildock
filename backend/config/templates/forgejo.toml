name = "Forgejo"
description = "Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job."
category = "stack"
logo = "svgs/forgejo.svg"

[[services]]
name = "forgejo"
category = "app"
subtype = "docker"
docker_image = "codeberg.org/forgejo/forgejo:8"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    FORGEJO__server__ROOT_URL = "https://example.com"
    FORGEJO__migrations__ALLOWED_DOMAINS = "${FORGEJO__migrations__ALLOWED_DOMAINS}"
    FORGEJO__migrations__ALLOW_LOCALNETWORKS = "${FORGEJO__migrations__ALLOW_LOCALNETWORKS-false}"
    USER_UID = "1000"
    USER_GID = "1000"
  [services.proxy]
    enabled = true
    type = "traefik"
    [[services.proxy.ports]]
      host = 80
      container = 80000520
    [[services.storage]]
      host = "forgejo-data"
      container = "/data"
    [[services.storage]]
      host = "forgejo-timezone"
      container = "/etc/timezone"
    [[services.storage]]
      host = "forgejo-localtime"
      container = "/etc/localtime"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
