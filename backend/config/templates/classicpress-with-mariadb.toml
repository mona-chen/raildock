name = "Classicpress With Mariadb"
description = "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
category = "stack"
logo = "svgs/classicpress.svg"

[[services]]
name = "classicpress"
category = "app"
subtype = "docker"
docker_image = "classicpress/classicpress:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    CLASSICPRESS_DB_HOST = "mariadb"
    CLASSICPRESS_DB_USER = "${{ linked.mariadb.MYSQL_USER }}"
    CLASSICPRESS_DB_PASSWORD = "${{ linked.mariadb.MYSQL_PASSWORD }}"
    CLASSICPRESS_DB_NAME = "classicpress"
    [[services.storage]]
      host = "classicpress-files"
      container = "/var/www/html"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "mariadb"
category = "database"
subtype = "mariadb"
  [services.env]
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "classicpress"
    MYSQL_USER = "${{ secret() }}"
    MYSQL_PASSWORD = "${{ secret() }}"
    [[services.storage]]
      host = "mariadb-data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "classicpress"
to = "mariadb"