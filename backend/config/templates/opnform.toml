name = "OpnForm is an open-source form builder that lets you create beautiful forms and share them anywhere. It's super fast, you don't need to know how to code"
description = "OpnForm is an open-source form builder that lets you create beautiful forms and share them anywhere. It's super fast, you don't need to know how to code"
category = "stack"
logo = "svg/opnform.svg"
[[services]]
name = "opnform-api"
category = "app"
subtype = "docker"
docker_image = "jhumanj/opnform-api:1.12.1"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    APP_NAME = "OpnForm"
    APP_ENV = "production"
    APP_KEY = "${SERVICE_BASE64_APIKEY}"
    APP_DEBUG = "${APP_DEBUG:-false}"
    APP_URL = "${SERVICE_URL_NGINX}"
    LOG_CHANNEL = "errorlog"
    LOG_LEVEL = "${LOG_LEVEL:-debug}"
    FILESYSTEM_DRIVER = "${FILESYSTEM_DRIVER:-local}"
    LOCAL_FILESYSTEM_VISIBILITY = "public"
    CACHE_DRIVER = "redis"
    QUEUE_CONNECTION = "redis"
    SESSION_DRIVER = "redis"
    SESSION_LIFETIME = "120"
    MAIL_MAILER = "${MAIL_MAILER:-log}"
    MAIL_HOST = "${MAIL_HOST}"
    MAIL_PORT = "${MAIL_PORT}"
    MAIL_USERNAME = "${MAIL_USERNAME:-your@email.com}"
    MAIL_PASSWORD = "${MAIL_PASSWORD}"
    MAIL_ENCRYPTION = "${MAIL_ENCRYPTION}"
    MAIL_FROM_ADDRESS = "${MAIL_FROM_ADDRESS:-your@email.com}"
    MAIL_FROM_NAME = "${MAIL_FROM_NAME:-OpnForm}"
    AWS_ACCESS_KEY_ID = "${AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY = "${AWS_SECRET_ACCESS_KEY}"
    AWS_DEFAULT_REGION = "${AWS_DEFAULT_REGION:-us-east-1}"
    AWS_BUCKET = "${AWS_BUCKET}"
    OPEN_AI_API_KEY = "${OPEN_AI_API_KEY}"
    TELEGRAM_BOT_ID = "${TELEGRAM_BOT_ID}"
    TELEGRAM_BOT_TOKEN = "${TELEGRAM_BOT_TOKEN}"
    REDIS_HOST = "redis"
    REDIS_PASSWORD = "${SERVICE_PASSWORD_64_REDIS}"
    DB_HOST = "postgresql"
    DB_DATABASE = "${POSTGRESQL_DATABASE:-opnform}"
    DB_USERNAME = "${SERVICE_USER_POSTGRESQL}"
    DB_PASSWORD = "${SERVICE_PASSWORD_POSTGRESQL}"
    DB_CONNECTION = "pgsql"
    PHP_MEMORY_LIMIT = "1G"
    PHP_MAX_EXECUTION_TIME = "600"
    PHP_UPLOAD_MAX_FILESIZE = "64M"
    PHP_POST_MAX_SIZE = "64M"
    JWT_TTL = "${JWT_TTL:-1440}"
    JWT_SECRET = "${SERVICE_PASSWORD_JWTSECRET}"
    JWT_SKIP_IP_UA_VALIDATION = "${JWT_SKIP_IP_UA_VALIDATION:-true}"
    H_CAPTCHA_SITE_KEY = "${H_CAPTCHA_SITE_KEY}"
    H_CAPTCHA_SECRET_KEY = "${H_CAPTCHA_SECRET_KEY}"
    RE_CAPTCHA_SITE_KEY = "${RE_CAPTCHA_SITE_KEY}"
    RE_CAPTCHA_SECRET_KEY = "${RE_CAPTCHA_SECRET_KEY}"
    SHOW_OFFICIAL_TEMPLATES = "${SHOW_OFFICIAL_TEMPLATES:-true}"
    [[services.storage]]
      host = "api-storage"
      container = "/usr/share/nginx/html/storage"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 15

