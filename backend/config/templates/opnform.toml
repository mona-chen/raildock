[[services]]
name = "opnform-ui"
category = "app"
subtype = "docker"
docker_image = "jhumanj/opnform-client:1.12.1"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    NUXT_PUBLIC_APP_URL = "/"
    NUXT_PUBLIC_API_BASE = "/api"
    NUXT_PRIVATE_API_BASE = "http://nginx/api"
    NUXT_PUBLIC_ENV = "production"
    NUXT_PUBLIC_H_CAPTCHA_SITE_KEY = "CHANGE_ME"
    NUXT_PUBLIC_RE_CAPTCHA_SITE_KEY = "CHANGE_ME"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "postgresql"
category = "database"
subtype = "postgres"
docker_image = "postgres:16"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "user"
    POSTGRES_PASSWORD = "CHANGE_ME"
    POSTGRES_DB = "opnform"
    [[services.storage]]
      host = "opnform-postgresql-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:7"
start_command = "redis-server --requirepass ${SERVICE_PASSWORD_64_REDIS}"
source = { type = "docker"  }
  [services.env]
    REDIS_PASSWORD = "CHANGE_ME"
    [[services.storage]]
      host = "redis-data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 30

[[services]]
name = "nginx"
category = "app"
subtype = "docker"
docker_image = "nginx:1.29.2"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

