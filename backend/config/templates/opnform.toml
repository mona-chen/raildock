name = "Opnform"
description = "OpnForm is an open-source form builder that lets you create beautiful forms and share them anywhere. It's super fast, you don't need to know how to code"
category = "stack"
logo = "svg/opnform.svg"

[[services]]
name = "opnform-api"
category = "app"
subtype = "docker"
docker_image = "jhumanj/opnform-api:1.12.1"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    APP_NAME = "OpnForm"
    APP_ENV = "production"
    APP_KEY = "BASE64_GENERATED"
    APP_DEBUG = "false"
    APP_URL = "https://example.com"
    LOG_CHANNEL = "errorlog"
    LOG_LEVEL = "debug"
    FILESYSTEM_DRIVER = "local"
    LOCAL_FILESYSTEM_VISIBILITY = "public"
    CACHE_DRIVER = "redis"
    QUEUE_CONNECTION = "redis"
    SESSION_DRIVER = "redis"
    SESSION_LIFETIME = "120"
    MAIL_MAILER = "log"
    MAIL_HOST = "https://example.com"
    MAIL_PORT = "3000"
    MAIL_USERNAME = "your@email.com"
    MAIL_PASSWORD = "CHANGE_ME"
    MAIL_ENCRYPTION = "MAIL_ENCRYPTION_VALUE"
    MAIL_FROM_ADDRESS = "your@email.com"
    MAIL_FROM_NAME = "OpnForm"
    AWS_ACCESS_KEY_ID = "CHANGE_ME"
    AWS_SECRET_ACCESS_KEY = "CHANGE_ME"
    AWS_DEFAULT_REGION = "us-east-1"
    AWS_BUCKET = "AWS_BUCKET_VALUE"
    OPEN_AI_API_KEY = "CHANGE_ME"
    TELEGRAM_BOT_ID = "TELEGRAM_BOT_ID_VALUE"
    TELEGRAM_BOT_TOKEN = "CHANGE_ME"
    REDIS_HOST = "redis"
    REDIS_PASSWORD = "CHANGE_ME"
    DB_HOST = "postgresql"
    DB_DATABASE = "opnform"
    DB_USERNAME = "user"
    DB_PASSWORD = "CHANGE_ME"
    DB_CONNECTION = "pgsql"
    PHP_MEMORY_LIMIT = "1G"
    PHP_MAX_EXECUTION_TIME = "600"
    PHP_UPLOAD_MAX_FILESIZE = "64M"
    PHP_POST_MAX_SIZE = "64M"
    JWT_TTL = "1440"
    JWT_SECRET = "CHANGE_ME"
    JWT_SKIP_IP_UA_VALIDATION = "true"
    H_CAPTCHA_SITE_KEY = "CHANGE_ME"
    H_CAPTCHA_SECRET_KEY = "CHANGE_ME"
    RE_CAPTCHA_SITE_KEY = "CHANGE_ME"
    RE_CAPTCHA_SECRET_KEY = "CHANGE_ME"
    SHOW_OFFICIAL_TEMPLATES = "true"
    [[services.storage]]
      host = "api-storage"
      container = "/usr/share/nginx/html/storage"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 15

