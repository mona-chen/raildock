name = "A self-hosted bookmark manager designed to be minimal, fast, and easy to set up."
description = "A self-hosted bookmark manager designed to be minimal, fast, and easy to set up."
category = "stack"
logo = "svgs/linkding.svg"
[[services]]
name = "linkding"
category = "app"
subtype = "docker"
docker_image = "sissbruecker/linkding:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_LINKDING_9090 = ""
    LD_SUPERUSER_NAME = "${SERVICE_USER_LINKDING}"
    LD_SUPERUSER_PASSWORD = "${SERVICE_PASSWORD_LINKDING}"
    [[services.storage]]
      host = "linkding_data"
      container = "/etc/linkding/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5
