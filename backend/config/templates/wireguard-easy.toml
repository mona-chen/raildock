name = "Wireguard Easy"
description = "The easiest way to run WireGuard VPN + Web-based Admin UI."
category = "stack"
logo = "svgs/wireguard.svg"

[[services]]
name = "wg-easy"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/wg-easy/wg-easy:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    WG_HOST = "${{ RAILDOCK_PUBLIC_DOMAIN }}"
    LANG = "en"
    WG_PORT = "51820"
    _PASSWORD = "${{ secret() }}"
  [services.proxy]
    enabled = true
    type = "traefik"
    [[services.proxy.ports]]
      host = 51820
      container = 51820
    [[services.storage]]
      host = "wg-easy"
      container = "/etc/wireguard"
