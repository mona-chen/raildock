name = "Plane"
description = "The open source project management tool"
category = "stack"
logo = "svgs/plane.svg"

[[services]]
name = "proxy"
category = "app"
subtype = "docker"
docker_image = "makeplane/plane-proxy:${APP_RELEASE:-v1.3.0}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    APP_DOMAIN = "https://example.com"
    SITE_ADDRESS = ":80"
    FILE_SIZE_LIMIT = "5242880"
    BUCKET_NAME = "uploads"
    [[services.storage]]
      host = "proxy_config"
      container = "/config"
    [[services.storage]]
      host = "proxy_data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "web"
category = "app"
subtype = "docker"
docker_image = "makeplane/plane-frontend:${APP_RELEASE:-v1.3.0}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "space"
category = "app"
subtype = "docker"
docker_image = "makeplane/plane-space:${APP_RELEASE:-v1.3.0}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "admin"
category = "app"
subtype = "docker"
docker_image = "makeplane/plane-admin:${APP_RELEASE:-v1.3.0}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "live"
category = "app"
subtype = "docker"
docker_image = "makeplane/plane-live:${APP_RELEASE:-v1.3.0}"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    REDIS_HOST = "plane-redis"
    REDIS_PORT = "6379"
    REDIS_URL = "redis://plane-redis:6379/"
    API_BASE_URL = "http://api:8000"
    LIVE_SERVER_SECRET_KEY = "$SERVICE_PASSWORD_64_LIVESECRET"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[services]]
name = "api"
category = "app"
subtype = "docker"
docker_image = "makeplane/plane-backend:${APP_RELEASE:-v1.3.0}"
start_command = "./bin/docker-entrypoint-api.sh"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    APP_DOMAIN = "https://example.com"
    FILE_SIZE_LIMIT = "5242880"
    BUCKET_NAME = "uploads"
    SITE_ADDRESS = ":80"
    AWS_ACCESS_KEY_ID = "$SERVICE_USER_MINIO"
    AWS_SECRET_ACCESS_KEY = "$SERVICE_PASSWORD_MINIO"
    AWS_S3_ENDPOINT_URL = "http://plane-minio:9000"
    AWS_S3_BUCKET_NAME = "uploads"
    MINIO_ROOT_USER = "$SERVICE_USER_MINIO"
    MINIO_ROOT_PASSWORD = "$SERVICE_PASSWORD_MINIO"
    REDIS_HOST = "plane-redis"
    REDIS_PORT = "6379"
    REDIS_URL = "redis://plane-redis:6379/"
    PGHOST = "plane-db"
    PGDATABASE = "plane"
    POSTGRES_USER = "$SERVICE_USER_POSTGRES"
    POSTGRES_PASSWORD = "$SERVICE_PASSWORD_POSTGRES"
    POSTGRES_DB = "plane"
    POSTGRES_PORT = "5432"
    PGDATA = "/var/lib/postgresql/data"
    APP_RELEASE = "v1.3.0"
    WEB_URL = "https://example.com"
    DEBUG = "0"
    CORS_ALLOWED_ORIGINS = "http://localhost"
    GUNICORN_WORKERS = "1"
    USE_MINIO = "1"
    DATABASE_URL = "postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane"
    SECRET_KEY = "$SERVICE_PASSWORD_64_SECRETKEY"
    AMQP_URL = "amqp://user:CHANGE_ME@plane-mq:5672/plane"
    API_KEY_RATE_LIMIT = "60/minute"
    MINIO_ENDPOINT_SSL = "0"
    LIVE_SERVER_SECRET_KEY = "$SERVICE_PASSWORD_64_LIVESECRET"
    [[services.storage]]
      host = "logs_api"
      container = "/code/plane/logs"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

