[[services]]
name = "plane-db"
category = "database"
subtype = "postgres"
docker_image = "postgres:15.7-alpine"
start_command = "postgres -c 'max_connections=1000'"
source = { type = "docker"  }
  [services.env]
    PGHOST = "plane-db"
    PGDATABASE = "plane"
    POSTGRES_USER = "$SERVICE_USER_POSTGRES"
    POSTGRES_PASSWORD = "$SERVICE_PASSWORD_POSTGRES"
    POSTGRES_DB = "plane"
    POSTGRES_PORT = "5432"
    PGDATA = "/var/lib/postgresql/data"
    [[services.storage]]
      host = "pgdata"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "plane-redis"
category = "app"
subtype = "docker"
docker_image = "valkey/valkey:7.2.11-alpine"
source = { type = "docker"  }
  [services.scaling]
    web = 1
    [[services.storage]]
      host = "redisdata"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "plane-mq"
category = "queue"
subtype = "rabbitmq"
docker_image = "rabbitmq:3.13.6-management-alpine"
source = { type = "docker"  }
  [services.env]
    RABBITMQ_HOST = "plane-mq"
    RABBITMQ_PORT = "5672"
    RABBITMQ_DEFAULT_USER = "user"
    RABBITMQ_DEFAULT_PASS = "CHANGE_ME"
    RABBITMQ_DEFAULT_VHOST = "plane"
    RABBITMQ_VHOST = "plane"
    [[services.storage]]
      host = "rabbitmq_data"
      container = "/var/lib/rabbitmq"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 30

[[services]]
name = "plane-minio"
category = "service"
subtype = "s3"
docker_image = "ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z"
start_command = "server /export --console-address \":9090\""
source = { type = "docker"  }
  [services.env]
    MINIO_ROOT_USER = "$SERVICE_USER_MINIO"
    MINIO_ROOT_PASSWORD = "$SERVICE_PASSWORD_MINIO"
    [[services.storage]]
      host = "uploads"
      container = "/export"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

