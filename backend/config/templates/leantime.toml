name = "Leantime"
description = "Leantime is a goals focused project management system for non-project managers."
category = "stack"
logo = "svgs/leantime.svg"

[[services]]
name = "leantime"
category = "app"
subtype = "docker"
docker_image = "leantime/leantime:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    LEAN_APP_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    LEAN_DB_HOST = "mysql"
    LEAN_DB_USER = "${{ linked.mysql.MYSQL_USER }}"
    LEAN_DB_PASSWORD = "${{ linked.mysql.MYSQL_PASSWORD }}"
    LEAN_DB_DATABASE = "leantime-db"
    LEAN_SESSION_PASSWORD = "${{ secret() }}"
    LEAN_SESSION_EXPIRATION = "28800"
    LEAN_USE_REDIS = "true"
    LEAN_REDIS_HOST = "redis"
    LEAN_REDIS_PORT = "6379"
    LEAN_REDIS_SCHEME = "tcp"
    [[services.storage]]
      host = "public-userfiles"
      container = "/var/www/html/public/userfiles"
    [[services.storage]]
      host = "userfiles"
      container = "/var/www/html/userfiles"
    [[services.storage]]
      host = "plugins"
      container = "/var/www/html/app/Plugins"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "mysql"
category = "database"
subtype = "mysql"
start_command = "--character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci"
source = { type = "docker"  }
  [services.env]
    MYSQL_ROOT_PASSWORD = "${{ secret() }}"
    MYSQL_USER = "${{ secret() }}"
    MYSQL_PASSWORD = "${{ secret() }}"
    MYSQL_DATABASE = "leantime-db"
    [[services.storage]]
      host = "leantime_mysql_data"
      container = "/var/lib/mysql"
  [services.checks]
    enabled = true
    wait = 30
    timeout = 10

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis:7-alpine"
start_command = "redis-server --appendonly yes"
source = { type = "docker"  }
    [[services.storage]]
      host = "leantime_redis_data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 5

[[links]]
from = "leantime"
to = "mysql"

[[links]]
from = "leantime"
to = "redis"