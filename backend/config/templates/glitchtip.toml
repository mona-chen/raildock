name = "Glitchtip"
description = "GlitchTip is a error tracking system."
category = "stack"
logo = "svgs/glitchtip.png"

[[services]]
name = "postgres"
category = "database"
subtype = "postgres"
docker_image = "postgres:16-alpine"
source = { type = "docker"  }
  [services.env]
    POSTGRES_USER = "user"
    POSTGRES_PASSWORD = "${{ secret() }}"
    POSTGRES_DB = "glitchtip"
    [[services.storage]]
      host = "glitchtip-postgres-data"
      container = "/var/lib/postgresql/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "redis"
category = "cache"
subtype = "redis"
docker_image = "redis"
source = { type = "docker"  }
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "web"
category = "app"
subtype = "docker"
docker_image = "glitchtip/glitchtip:6.0"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DATABASE_URL = "postgres://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/glitchtip"
    SECRET_KEY = "$SERVICE_BASE64_64_ENCRYPTION"
    EMAIL_URL = "consolemail://"
    GLITCHTIP_DOMAIN = "https://example.com"
    DEFAULT_FROM_EMAIL = "test@example.com"
    CELERY_WORKER_AUTOSCALE = "1,3"
    CELERY_WORKER_MAX_TASKS_PER_CHILD = "10000"
    [[services.storage]]
      host = "uploads"
      container = "/code/uploads"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "worker"
category = "app"
subtype = "docker"
docker_image = "glitchtip/glitchtip:6.0"
start_command = "./bin/run-celery-with-beat.sh"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    DATABASE_URL = "postgres://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/glitchtip"
    SECRET_KEY = "$SERVICE_BASE64_64_ENCRYPTION"
    EMAIL_URL = "consolemail://"
    GLITCHTIP_DOMAIN = "https://example.com"
    DEFAULT_FROM_EMAIL = "test@example.com"
    CELERY_WORKER_AUTOSCALE = "1,3"
    CELERY_WORKER_MAX_TASKS_PER_CHILD = "10000"
    [[services.storage]]
      host = "uploads"
      container = "/code/uploads"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[links]]
from = "web"
to = "postgres"

[[links]]
from = "web"
to = "redis"

[[links]]
from = "worker"
to = "postgres"

[[links]]
from = "worker"
to = "redis"

[[links]]
from = "migrate"
to = "postgres"

[[links]]
from = "migrate"
to = "redis"
