name = "Golang WhatsApp - Built with Go for efficient memory use"
description = "Golang WhatsApp - Built with Go for efficient memory use"
category = "stack"
logo = "svgs/gowa.svg"
[[services]]
name = "gowa"
category = "app"
subtype = "docker"
docker_image = "aldinokemal2104/go-whatsapp-web-multidevice:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_GOWA_3000 = ""
    SERVICE_USER_GOWA = ""
    SERVICE_PASSWORD_GOWA = ""
    APP_BASIC_AUTH = "${SERVICE_USER_GOWA}:${SERVICE_PASSWORD_GOWA}"
    APP_PORT = "3000"
    APP_DEBUG = "${APP_DEBUG:-false}"
    APP_ACCOUNT_VALIDATION = "${APP_ACCOUNT_VALIDATION:-false}"
    WHATSAPP_WEBHOOK = "${WHATSAPP_WEBHOOK}"
    WHATSAPP_WEBHOOK_SECRET = "${WHATSAPP_WEBHOOK_SECRET}"
    [[services.storage]]
      host = "gowa_data"
      container = "/app/storages"
