name = "Vert"
description = "The next-generation file converter. Open source, fully local and free forever."
category = "stack"
logo = "svgs/vert.png"

[[services]]
name = "vert"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/vert-sh/vert:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    PUB_VERT_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    PUB_HOSTNAME = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    PUB_PORT = "80"
    PUB_ENV = "production"
