name = "Karakeep"
description = "A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text search"
category = "stack"
logo = "svgs/karakeep.svg"

[[services]]
name = "web"
category = "app"
subtype = "docker"
docker_image = "ghcr.io/karakeep-app/karakeep:release"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    NEXTAUTH_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    NEXTAUTH_SECRET = "${{ secret() }}"
    MEILI_MASTER_KEY = "${{ secret() }}"
    MEILI_ADDR = "http://meilisearch:7700"
    BROWSER_WEB_URL = "http://chrome:9222"
    OPENAI_API_KEY = "${{ secret() }}"
    DISABLE_SIGNUPS = "false"
    DATA_DIR = "/data"
    [[services.storage]]
      host = "karakeep-data"
      container = "/data"

[[services]]
name = "chrome"
category = "app"
subtype = "docker"
docker_image = "gcr.io/zenika-hub/alpine-chrome:124"
start_command = "--no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --hide-scrollbars"
source = { type = "docker"  }
  [services.scaling]
    web = 1

[[services]]
name = "meilisearch"
category = "search"
subtype = "meilisearch"
docker_image = "getmeili/meilisearch:v1.13.3"
source = { type = "docker"  }
  [services.env]
    MEILI_NO_ANALYTICS = "true"
    NEXTAUTH_SECRET = "${{ secret() }}"
    MEILI_MASTER_KEY = "${{ secret() }}"
    NEXTAUTH_URL = "https://${{ RAILDOCK_PUBLIC_DOMAIN }}"
    [[services.storage]]
      host = "karakeep-meilisearch"
      container = "/meili_data"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10

[[links]]
from = "web"
to = "meilisearch"

[[links]]
from = "chrome"
to = "meilisearch"
