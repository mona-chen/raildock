name = "Huly"
description = "Open Source All-in-One Project Management Platform"
category = "stack"

[[services]]
name = "mongodb"
category = "database"
subtype = "mongo"
docker_image = "mongo:7-jammy"
source = { type = "docker"  }
  [services.env]
    PUID = "1000"
    PGID = "1000"
    [[services.storage]]
      host = "huly-db"
      container = "/data/db"

[[services]]
name = "minio"
category = "service"
subtype = "s3"
docker_image = "ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z"
start_command = "server /data --address \":9000\" --console-address \":9001\""
source = { type = "docker"  }
    [[services.storage]]
      host = "huly-files"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20

[[services]]
name = "elastic"
category = "search"
subtype = "elasticsearch"
docker_image = "elasticsearch:7.14.2"
start_command = "/bin/sh -c \"./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;\n/usr/local/bin/docker-entrypoint.sh eswrapper\"\n"
source = { type = "docker"  }
  [services.env]
    ELASTICSEARCH_PORT_NUMBER = "9200"
    BITNAMI_DEBUG = "true"
    discovery.type = "single-node"
    ES_JAVA_OPTS = "-Xms1024m -Xmx1024m"
    http.cors.enabled = "true"
    http.cors.allow-origin = "http://localhost:8082"
    [[services.storage]]
      host = "huly-elastic"
      container = "/usr/share/elasticsearch/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 30

[[services]]
name = "account"
category = "app"
subtype = "docker"
docker_image = "hardcoreeng/account:v0.6.246"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVER_PORT = "3000"
    SERVER_SECRET = "$SERVICE_PASSWORD_SECRET"
    MONGO_URL = "mongodb://mongodb:27017"
    TRANSACTOR_URL = "ws://transactor:3333"
    ENDPOINT_URL = "ws://transactor:3333"
    MINIO_ENDPOINT = "minio"
    MINIO_ACCESS_KEY = "minioadmin"
    MINIO_SECRET_KEY = "minioadmin"
    FRONT_URL = "http://front:8080"
    INIT_WORKSPACE = "demo-tracker"
    MODEL_ENABLED = "*"
    ACCOUNTS_URL = "http://localhost:3000"

[[services]]
name = "front"
category = "app"
subtype = "docker"
docker_image = "hardcoreeng/front:v0.6.246"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    MONGO_URL = "mongodb://mongodb:27017"
    SERVER_PORT = "8080"
    SERVER_SECRET = "$SERVICE_PASSWORD_SECRET"
    ACCOUNTS_URL = "http://account:3000"
    REKONI_URL = "http://rekoni:4004"
    CALENDAR_URL = "http://localhost:8095"
    GMAIL_URL = "http://localhost:8088"
    TELEGRAM_URL = "http://localhost:8086"
    UPLOAD_URL = "/files"
    TRANSACTOR_URL = "ws://transactor:3333"
    ELASTIC_URL = "http://elastic:9200"
    COLLABORATOR_URL = "ws://collaborator:3078"
    COLLABORATOR_API_URL = "http://collaborator:3078"
    MINIO_ENDPOINT = "minio"
    MINIO_ACCESS_KEY = "minioadmin"
    MINIO_SECRET_KEY = "minioadmin"
    TITLE = "Huly Self Hosted"
    DEFAULT_LANGUAGE = "en"
    LAST_NAME_FIRST = "true"

[[services]]
name = "collaborator"
category = "app"
subtype = "docker"
docker_image = "hardcoreeng/collaborator:v0.6.246"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    COLLABORATOR_PORT = "3078"
    SECRET = "secret"
    ACCOUNTS_URL = "http://account:3000"
    TRANSACTOR_URL = "ws://transactor:3333"
    UPLOAD_URL = "/files"
    MONGO_URL = "mongodb://mongodb:27017"
    MINIO_ENDPOINT = "minio"
    MINIO_ACCESS_KEY = "minioadmin"
    MINIO_SECRET_KEY = "minioadmin"

[[services]]
name = "transactor"
category = "app"
subtype = "docker"
docker_image = "hardcoreeng/transactor:v0.6.246"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVER_PORT = "3333"
    ELASTIC_INDEX_NAME = "huly"
    SERVER_SECRET = "$SERVICE_PASSWORD_SECRET"
    SERVER_CURSOR_MAXTIMEMS = "30000"
    ELASTIC_URL = "http://elastic:9200"
    MONGO_URL = "mongodb://mongodb:27017"
    METRICS_CONSOLE = "false"
    METRICS_FILE = "metrics.txt"
    MINIO_ENDPOINT = "minio"
    MINIO_ACCESS_KEY = "minioadmin"
    MINIO_SECRET_KEY = "minioadmin"
    REKONI_URL = "http://rekoni:4004"
    FRONT_URL = "http://localhost:8087"
    SERVER_PROVIDER = "ws"
    ACCOUNTS_URL = "http://account:3000"
    LAST_NAME_FIRST = "true"
    UPLOAD_URL = "/files"

[[services]]
name = "rekoni"
category = "app"
subtype = "docker"
docker_image = "hardcoreeng/rekoni-service:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
