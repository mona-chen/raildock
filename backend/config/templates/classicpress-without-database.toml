name = "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
description = "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
category = "stack"
logo = "svgs/classicpress.svg"
[[services]]
name = "classicpress"
category = "app"
subtype = "docker"
docker_image = "classicpress/classicpress:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    SERVICE_URL_CLASSICPRESS = ""
    [[services.storage]]
      host = "classicpress-files"
      container = "/var/www/html"
  [services.checks]
    enabled = true
    wait = 2
    timeout = 10
