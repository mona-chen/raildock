name = "Organizr"
description = "Homelab Services Organizer"
category = "stack"
logo = "svgs/organizr.png"

[[services]]
name = "organizr"
category = "app"
subtype = "docker"
docker_image = "organizr/organizr:latest"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    branch = "v2-master"
    [[services.storage]]
      host = "organizr-data"
      container = "/config"
  [services.checks]
    enabled = true
    wait = 10
    timeout = 1
