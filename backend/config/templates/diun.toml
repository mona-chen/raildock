name = "Docker Image Update Notifier is a CLI application to receive notifications when a Docker image is updated on a Docker registry."
description = "Docker Image Update Notifier is a CLI application to receive notifications when a Docker image is updated on a Docker registry."
category = "stack"
logo = "svgs/diun.svg"
[[services]]
name = "diun"
category = "app"
subtype = "docker"
docker_image = "crazymax/diun:latest"
start_command = "serve"
source = { type = "docker"  }
  [services.scaling]
    web = 1
  [services.env]
    TZ = "${TIME_ZONE:-Europe/Vienna}"
    LOG_LEVEL = "${LOG_LEVEL:-info}"
    LOG_JSON = "${LOG_JSON:-false}"
    DIUN_WATCH_WORKERS = "${DIUN_WATCH_WORKERS:-20}"
    DIUN_WATCH_SCHEDULE = "${DIUN_WATCH_SCHEDULE:- * */6 * * *}"
    DIUN_WATCH_JITTER = "${DIUN_WATCH_JITTER:-30s}"
    DIUN_PROVIDERS_DOCKER = "${DIUN_PROVIDERS_DOCKER:-true}"
    DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT = "${DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT:-true}"
    DIUN_NOTIF_SLACK_WEBHOOKURL = "${SERVICE_WEBHOOK_URL_SLACK}"
    [[services.storage]]
      host = "diun_data"
      container = "/data"
  [services.checks]
    enabled = true
    wait = 5
    timeout = 20
